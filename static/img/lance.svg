<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Body — lance beetle, elytra shell -->
  <ellipse cx="64" cy="72" rx="26" ry="34" fill="#2d6a4f"/>
  <!-- Elytra seam (wing split line) -->
  <line x1="64" y1="42" x2="64" y2="104" stroke="#1b4332" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Shell segments -->
  <path d="M42 62 Q64 58 86 62" stroke="#1b4332" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M40 78 Q64 74 88 78" stroke="#1b4332" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Pronotum (thorax plate) -->
  <ellipse cx="64" cy="42" rx="18" ry="10" fill="#3a7d5c"/>
  <!-- Head -->
  <ellipse cx="64" cy="30" rx="12" ry="9" fill="#245840"/>
  <!-- Eyes -->
  <circle cx="55" cy="28" r="4" fill="#fff"/>
  <circle cx="73" cy="28" r="4" fill="#fff"/>
  <circle cx="56" cy="27" r="2.2" fill="#1a1a2e"/>
  <circle cx="74" cy="27" r="2.2" fill="#1a1a2e"/>
  <circle cx="57" cy="26.5" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="75" cy="26.5" r="0.8" fill="#fff" opacity="0.6"/>
  <!-- Antennae — right one is the LANCE (longer, forward-pointing) -->
  <path d="M58 22 Q50 8 42 4" stroke="#245840" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="42" cy="4" r="2" fill="#245840"/>
  <!-- Lance antenna — longer, straighter, pointed forward -->
  <path d="M70 22 Q74 10 78 2" stroke="#245840" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="78,2 82,0 78,-2" fill="#245840" transform="translate(0,2)"/>
  <!-- Legs — 3 pairs -->
  <path d="M42 56 L28 50 L24 56" stroke="#245840" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M86 56 L100 50 L104 56" stroke="#245840" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M40 72 L24 72 L20 78" stroke="#245840" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M88 72 L104 72 L108 78" stroke="#245840" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M42 88 L28 94 L26 100" stroke="#245840" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M86 88 L100 94 L102 100" stroke="#245840" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Compass rose (path/direction tool) -->
  <g transform="translate(100, 14) scale(0.7)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#52b788" stroke-width="1.5" opacity="0.7"/>
    <polygon points="0,-9 2,-3 -2,-3" fill="#52b788" opacity="0.8"/>
    <polygon points="0,9 2,3 -2,3" fill="#52b788" opacity="0.4"/>
    <polygon points="-9,0 -3,2 -3,-2" fill="#52b788" opacity="0.4"/>
    <polygon points="9,0 3,2 3,-2" fill="#52b788" opacity="0.4"/>
  </g>
</svg>
