{{template "head" .}}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Posting is for the driver.{{if .SitePrivate}} The whole site is private for now &mdash; sign in to see the map and the timeline.{{else}} The map and the timeline are public.{{end}}</p>
  {{with .Error}}<p class="error">{{.}}</p>{{end}}
  <form method="post" action="/admin/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Password<input name="password" type="password" required autofocus autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{{template "foot" .}}
