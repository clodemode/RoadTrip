{{template "head" .}}
<section class="photo-view">
  <p class="photo-view-links">
    <a class="photo-back" href="/legs/{{.P.LegSlug}}#post-{{.P.ID}}">&larr; Back to the timeline</a>
    <a class="photo-original" href="/media/{{.Photo.Path}}">Open the original</a>
  </p>
  <img class="photo-view-fit" src="/media/{{.Photo.Path}}" alt="{{.P.Title}}">
  <p class="muted small figure">{{if .P.Title}}{{.P.Title}} &middot; {{end}}<time>{{local .P.OccurredAt .P.TZ}}</time></p>
  {{if .P.Body}}<p class="post-text">{{.P.Body}}</p>{{end}}
</section>
{{template "foot" .}}
