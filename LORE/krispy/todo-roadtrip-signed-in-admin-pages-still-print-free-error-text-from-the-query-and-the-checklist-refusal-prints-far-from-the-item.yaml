entries:
- slug: todo-roadtrip-signed-in-admin-pages-still-print-free-error-text-from-the-query-and-the-checklist-refusal-prints-far-from-the-item
  title: 'roadtrip: the signed-in admin pages still print free ?error= text from the query string, and
    a refused check-off prints its reason at the top of /checklist while the redirect lands on the item'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: surface
  character_slug: krispy
  tags:
  - roadtrip
  - admin
  - error-codes
  - checklist
  - ui
  status: design
  description: 'Two leftovers found while fixing the public pages in roadtrip commit d91dbf3 (the trip
    planner branch, 2026-11-06). (1) /plan and /checklist now take a short code in ?error= and print a
    fixed sentence (planRefusals, checklistRefusals). Three signed-in pages still redirect with the reason
    in words and print whatever the query holds: the post form (/admin/post?error=), the lodging form
    (/admin/lodging?error=) and the post edit page. They are behind requireAuth, so no anonymous visitor
    sees them, which is why they were out of scope; the remaining exposure is a crafted link that shows
    the signed-in trip-keeper a sentence the app never wrote, on a page that looks like the app speaking.
    Some of those messages carry request detail (a file name, a size), so a plain code table loses information
    there and needs a decision per message. (2) A refused check-off redirects a browser to /checklist?error=<code>#<kind>-<id>.
    The anchor scrolls to the item, but the "Not saved" line is rendered once, in the page head, far above
    it, so on a phone the refusal is off screen. /plan was given a result line under the button it belongs
    to; /checklist was not, because the review asked only for the text to stop being free.'
  dont: 'DONT put the reason back in the query string as words on any page. DONT log or echo a refused
    value: a refusal names the field (the checklist VIN rule).'
  do_this: 'For the three admin pages, replace the free text with codes mapped to fixed sentences the
    way plan_handlers.go and checklist_handlers.go do, keeping any detail that matters by wording the
    sentence generally. For /checklist, render the mapped refusal inside the item the redirect lands on
    (the item id is already in the fragment; carry it in the query as well, validated with validItemID,
    so the template can place the line), and keep the page-head line only when no item is named. Each
    with a test: free text prints nothing, every code prints its sentence, and the checklist line sits
    inside the named item.'
  do_also: review_fixes_test.go (TestErrorQueryPrintsOnlyFixedSentences) is the pattern to extend.
  effort: S
  impact: low
  triaged_at: '2026-11-06T20:50:27.349710+00:00'
  triaged_by: krispy
