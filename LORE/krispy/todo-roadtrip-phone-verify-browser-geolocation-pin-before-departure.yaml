entries:
- slug: todo-roadtrip-phone-verify-browser-geolocation-pin-before-departure
  title: 'roadtrip: Kris phone-verifies the browser-geolocation pin on the live post form before 2026-09-04 06:30 CDT (Safari prompt, "location: on (±N m)", pin lands on the map)'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: tools
  character_slug: krispy
  tags:
  - roadtrip
  - atx-sjc
  - photo
  - gps
  - geolocation
  - pin
  - phone
  - verify
  - spring-2026-09
  status: design
  description: 'The pin fallback shipped at roadtrip 48b281c / Fly v7 and is proven by curl and a desktop browser against a Docker copy, but the one path that only a phone can prove is untested: Safari on the iPhone must show the geolocation prompt once for roadtrip-clodemode.fly.dev, the form''s status line must read "location: on (±N m)" with "Attach my location" ticked, and a JPEG taken through the form (which Safari strips of GPS) must land on the map at the phone''s position with pin_source=browser and the popup line "phone location ±N m". If the prompt was denied earlier, Settings → Safari → Location (or the aA menu → Website Settings) resets it; the fallback then is the chosen checkpoint, which the status line says. Do this from the driveway before departure, not from the road.'
  dont: Don't leave a browser-pinned test post from home on the public map — the browser pin is the real position, not the 0.05° snap the origin checkpoint gets.
  do_this: 'Kris: sign in on the phone, open /admin/post, allow location, post one photo with checkpoint 1 selected, confirm window.RIDE.posts on / shows pin_source "browser" for it (or just see the pin at the house, fuzz-free — delete the test post afterwards since a browser pin is NOT fuzzed). If the status line stays "location: off" over https, file what it said.'
  do_also: "2026-09-02 00:10Z, roadtrip 0eceea3 / Fly v10: the driveway test is now safe to leave up. A browser or EXIF pin in the same 0.05° cell as (or within 2 km of) a fuzzed checkpoint is stored as that checkpoint's snapped point with pin_source=checkpoint, near=<checkpoint>, no accuracy_m (store.go nearPrivate; boot sweep pins_fuzzed_near_private_v1 did the same for earlier posts). Verified locally: form lat/lng 30.4236,-97.9325 → stored 30.4/-97.95 near Hudson Bend (home); live post 1 reads [-97.95, 30.4] checkpoint on /route.geojson. So on the phone the popup will say \"near Hudson Bend (home)\", not \"phone location ±N m\" — that is the expected result of a driveway post, not a failed browser fix. To prove the browser fix itself from the driveway, watch the form's status line (\"location: on (±N m)\") rather than the pin. Also: the photo input no longer carries capture=environment, so iOS offers Photo Library as well as the camera. The DONT above is therefore satisfied by the app; the test post no longer needs deleting."
