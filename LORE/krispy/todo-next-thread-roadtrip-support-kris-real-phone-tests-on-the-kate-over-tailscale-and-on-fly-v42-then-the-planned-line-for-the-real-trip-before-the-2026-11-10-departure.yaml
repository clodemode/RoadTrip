  title: 'TODO-NEXT, roadtrip (start on Opus, thin tokens): support Kris''s real phone tests on the KATE
    over Tailscale and on Fly v42 and fix what he hits, then the planned line for the real trip, Chester''s
    first real music question and the driver-screen polish, before the 2026-11-10 departure'
  domain: lore
