entries:
- slug: spec-roadtrip-driver-aids-test-round-on-a-local-kate-with-melt-on-hey-lean-sim-corridor-eta-policy-and-photo-fed-trip-log
  title: 'roadtrip: the driver-aids test round runs on a local KATE (roadtrip-kate, :8089, fleet Redis)
    with MELT on HEY_LEAN, a randomized Kingston-to-Toronto sim corridor masking Kris''s real position,
    an ETA policy (none until driving, rounded, hit rate tracked) and phone photos that feed the trip
    log'
  domain: lore
  lore_type: spec
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - driver-aids
  - kate
  - melt
  - telemetry
  - sim
  - eta
  - photos
  - '2026-11-07'
  status: shipped
  description: |-
    Kris 2026-11-07: start testing the driver aids from his phone; use MELT when he interacts; run this round on a KATE for roadtrip with full MELT on the HEY_LEAN Redis bus for fast change and repair without Fly deploys; randomize a Kingston-to-Toronto drive as a mask of his real data (he runs it from his home office in Kingston). Then: no ETA at this time, ETA only matters while driving, never over-precise, and a telemetry store tracking how well the ETAs we do show are met. Then: photos uploaded easily from the phone, camera or library (metadata matters), updating routing and trip logging from the photo; simulated for the test. Then: builders on thin token consumption (weekly limit). First reports from his phone on prod v41: the Google Maps and Apple Maps links did nothing; where is the integrated music player (the RoadTracks card is a search that links out to music.opeongo.net; no player is embedded, by the DriveTrack row's design).

    STATE 2026-11-07 14:25 CST (20:25 UTC): roadtrip trunk f24950d; roadtrip-kate running that image on :8089 with the real trip and checklist copied from data/trips into data/kate/trips (volume trips: 1 loaded, checklists: 1 loaded); signed in as kris with the KATE password; /driver?sim=100&from=44.2290,-76.4810&to=43.6532,-79.3832&x=60 drives from downtown Kingston toward Toronto and the HUD reads Day 1 of 4, Thousand Islands 38 mi ahead, GPS fix. The HUD shows 'ETA PITTSBURGH 10:34 PM EST plan pace' before departure, which is exactly what Kris does not want. TomTom and Chester keys are the ones from roadtrip/.env; ROADTRACKS_TOKEN is unset on the KATE so the card is off there.
  dont: 'DONT deploy to Fly to test a driver-aid change in this round; the KATE is the venue and the image
    is rebuilt from the PR branch. DONT put a coordinate, a private place name, a destination the driver
    typed or a checklist''s private text in a MELT record or a telemetry event; distances are rounded
    miles, positions never leave the HUD request. DONT render an ETA before the car is driving (a fix
    on the leg and moving) and never to the minute: round to 5 minutes and say ''about''. DONT mark a
    checkpoint arrived from a photo silently; the driver confirms with one tap. DONT give a builder CODI
    Fable or an open-ended brief: Sonnet, named files and line ranges, one RED/GREEN cycle, a 25-line
    report.'
  do_this: 'Venue: docker build -t roadtrip:kate from the branch under test; docker run --name roadtrip-kate
    --network about_default -p 8089:8080 --env-file roadtrip/data/kate.env -v roadtrip/data/kate:/data
    roadtrip:kate (data/ is gitignored; kate.env holds a KATE-only password, SESSION_KEY, RIDE_SLUG=ygk-atx-2026-11,
    COOKIE_SECURE=0, no SITE_URL so nothing 301s to prod). Phone reaches it on the home LAN at http://192.168.40.176:8089
    (plain HTTP: the browser gives no real GPS, the sim drive supplies position, photo upload works).
    Waves, one PR each on clodemode/RoadTrip: A melt.go (MELT_REDIS_ADDR, LPUSH+LTRIM onto clode:state:melt:roadtrip:{events,errors},
    record {ts,source,event,origin,venue,...}) + POST /driver/telemetry allowlisted phone events (nav_tap,
    nav_result, geo_error, js_error, sim_tick, page_view) + hud.js/sim.js hooks; B sim corridor preset
    (sim=kgn-yyz: Kingston to Toronto along the 401 with randomized start offset, speed and jitter, any
    rung); C ETA policy in hud.go/freelance.go (hidden until driving, 5-minute rounding, ''about'') +
    an eta_predictions table and an outcome row on checkpoint arrival, emitted to MELT as eta_hit; D photo-to-trip-log:
    a post pinned by EXIF or browser within 2 km of the next unarrived checkpoint offers ''Mark arrived
    at <stop> at <photo time>'' as one tap, and a test photo fixture with synthetic EXIF under testdata/.
    Music ruling pending before any player work.'
  do_also: |-
    Open questions for Kris, 2026-11-07: (1) music on /driver: keep the RoadTracks card linking out to the MusicOrgan player, embed the player in a frame, or build a mini-player whose audio element plays MusicOrgan's own stream URLs (the DriveTrack row's DONT only forbids streaming audio THROUGH RoadTrip's server); (2) ETA rounding 5 vs 15 minutes (the parent took 5 for wave C2); (3) HTTPS for real GPS on the phone via Tailscale serve (tailscale is installed on the Mac but stopped) or stay on LAN HTTP with the sim; (4) the RoadTracks token for the KATE (paste the prod token into data/kate.env, or run the card off on KATE). Observed on prod and KATE 2026-11-07: the Google/Apple hrefs on /driver are well-formed (destination 44.338,-75.985 Thousand Islands), so Kris's dead taps are iOS-side; the nav_tap + nav_result telemetry is the instrument; Kris later confirmed Apple Maps worked. Also observed: 150 traffic-closure chips on the Day 1 leg ('and 146 more'); a chip budget is a candidate todo.

    RULED by Kris 2026-11-07, 15:0x EST, in order: (a) "tab control and coordination already haunts my musicorgan player. Please get it right at the beginning. Go Gherkin" — the simulated position is ONE server-held record per signed-in driver (sim.go, SIM_ALLOWED=1), never a per-tab fake or browser storage; shipped as PR 25 with features/sim_position.feature (godog). (b) "the lack of location is fine, but for our test mode, insert a phone location" — same PR: the HUD and Chester's ask fall back to the server-held sim position. (c) The photo form, after his first upload on the KATE: the arrive-strip at the top of /driver/post (one btn-primary "Arrived: <Name>" per checkpoint of the default leg, each tap stamping an arrival at once) read as "three destinations, massive CTA buttons, not subtle, unclear if selected". Ruling: the form is titled "Post a Photo"; the default is just a photo, no milestone; an OPTIONAL quiet selector (radio bullets, none selected) lists only the milestones not yet arrived at; posting with one selected marks that milestone arrived at the photo's time (EXIF DateTimeOriginal, else now); a photo pinned within 2 km of an unarrived milestone pre-highlights that bullet without selecting it. The arrive-strip leaves the post form (arrivals keep their own route and the plan page). Wave D, Gherkin first, stacked on C2 because both touch handlers.go and store.go.
