entries:
- slug: ruling-roadtrip-a-signed-in-drivers-photo-may-tell-claude-its-exact-location-unless-fuzzed-or-near-a-private-stop-and-fuzz-this-keeps-the-exact-spot-privately-for-unfuzz
  title: 'RULED by Kris 2026-11-08: a signed-in driver''s photo post may tell Claude its exact location
    unless the post is fuzzed or lies near a private stop; being signed in is the trust (no device token);
    one-tap Fuzz This during and after upload keeps the exact spot privately so Unfuzz can restore it'
  domain: lore
  lore_type: guidance
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - ruling
  - privacy
  - pin
  - fuzz
  - chester
  - photo
  status: canonical
  description: 'Raised by the PHO_ME thread''s note that RoadTrip''s rules bar sending exact coordinates
    or private places to the API. Kris, 2026-11-08: "I want to allow precise data on Take Photo, user
    can provide permission on camera during upload, or we establish a key to my camera as a token holding
    trusted device. Or just recognize it, can be very simple. During and after any photo upload, it is
    very easy to press this Fuzz This button to make that particular location info fuzzy (inexact)". Asked
    as two questions with a recommendation, he chose "Exact, except private" for what Claude may be told,
    and "Keep it privately, allow Unfuzz" for what Fuzz This does to the exact spot. Trust: every post
    already needs a signed-in driver, so sign-in is the recognition, and the phone''s location prompt
    is the permission. This extends, and does not replace, ruling-roadtrip-site-is-private-until-kris-opens-it-and-pins-are-precise-except-at-private-places:
    pins stay exact by default on the map and private places stay fuzzed by default. Scope to Claude is
    a post''s pin. The car''s live position stays at three decimals, because the ruling was about photos.'
  dont: 'DONT send an exact point to Claude for a fuzzed post or for a point near a precision=fuzzed stop.
    DONT render, log, export or put in any JSON a fuzzed post''s kept exact point: it is read in one store
    seam, only for Unfuzz. DONT read this as allowing photos to Chester: chester.go''s rule that the API
    is never told a photo needs its own ruling. DONT read it as covering uploads by anyone not signed
    in: no public upload exists, and one would need a new ruling. DONT add a device token or second credential
    for this.'
  do_this: 'A post''s pin goes to Claude through publishPosition at full precision unless the post is
    fuzzed or near a private stop. Fuzzing stores the exact point in private columns and publishes the
    fuzzy one. Unfuzz restores it. Contract: features/fuzz_this.feature.'
  do_also: 'PHO_ME''s hosted photo intake (todo-phome-hosted-photo-intake-and-claude-vision-cost-assessment-on-fly-starting-with-roadtrip)
    may rely on this for location, but its DONT on sending EXIF or GPS in the photo itself still stands:
    location travels as a field after this rule is applied, never inside the image.'
