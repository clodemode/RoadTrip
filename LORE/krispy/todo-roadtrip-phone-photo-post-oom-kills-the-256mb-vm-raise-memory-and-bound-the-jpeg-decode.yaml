entries:
- slug: todo-roadtrip-phone-photo-post-oom-kills-the-256mb-vm-raise-memory-and-bound-the-jpeg-decode
  title: 'roadtrip: a phone photo post OOM-killed the 256 mb Fly VM (2026-09-02 00:49Z, anon-rss 158 MB) — four posts lost; raise memory to 512 mb now and bound the JPEG decode + thumbnail path'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: logic
  character_slug: krispy
  tags:
  - roadtrip
  - atx-sjc
  - fly
  - oom
  - photo
  - jpeg
  - memory
  - spring-2026-09
  status: shipped
  description: 'Fly log for roadtrip-clodemode, machine 784149ead70ee8, release v14: Kris POSTed /driver/post from the phone at 00:48:49, 00:49:04, 00:50:47 and 00:51:07Z on 2026-09-02; at 00:49:06Z the kernel logged "Out of memory: Killed process 641 (roadtrip) total-vm:1378728kB, anon-rss:158696kB", the proxy returned "connection reset by peer", init reported "Process appears to have been OOM killed!" and the machine rebooted (planning refreshed again at 00:49:08Z). None of the four produced a post: /route.geojson carries posts 1 (photo, 23:47Z Sep 1, which succeeded on the same 256 mb) and 2 (the 00:54:41Z note). So a full-size iPhone JPEG (12–48 MP) decoded with image/jpeg plus the x/image/draw thumbnail exceeds what a 256 mb VM leaves after the kernel and page cache; post 1 was presumably smaller. The pin ladder never runs for a post that dies in decode, so this masquerades as "my GPS did not show" on the phone. The app keeps no record of a request it was killed in; the only trace is the Fly log.'
  dont: Don't diagnose this as a geolocation failure — the note that did land was snapped to Hudson Bend (home) by the private-place rule, which is correct; the photo posts never reached the pin ladder. Don't ask Kris to shrink photos by hand on the road.
  do_this: 'Immediate, before departure 2026-09-04 06:30 CDT: fly.toml [[vm]] memory "256mb" → "512mb" (far under the 2 GB suspend cap; the fly.toml comment on suspend stays true), flyctl deploy, then Kris re-posts the same photo from the phone and it must land with a pin. Then bound the decode: image.DecodeConfig first and refuse (or draw-downscale from a bounded decode) anything over a set megapixel limit; decode once and derive the thumbnail from that image; keep peak RSS measured against the VM size. Add one server log line per post with the pin ladder outcome (source, accuracy, snapped-to) so a driveway GPS test is provable from the log.'
  do_also: 'SHIPPED 2026-09-02 01:11Z by codi-roadtrip-photo-oom-krispy-2026-09-02: roadtrip 0bf8fe7 → Fly release v15, machine 784149ead70ee8 now shared-cpu-1x:512MB; boot log shows "memory limit: 344 MiB (75% of 458 MiB MemTotal)", planning refreshed, canonical host, no OOM; https://roadtrip.opeongo.net/ 200; route.geojson still carries posts 1 (photo) and 2 (note). ROOT CAUSE, measured in Docker with the v14 binary: 48 MP 4:2:0 JPEG (8064×6048, 13.3 MB) OOM-killed at --memory=256m; at 512m it peaked at VmHWM 309 MB; 12 MP peaked 123 MB at 256m. The peak was NOT the jpeg decode (73 MB of YCbCr for 48 MP) — it was x/image/draw''s Kernel scaler (draw.BiLinear.Scale), which allocates a float64 buffer of source-width × target-height × 32 B = 155 MB for an 8064-wide source shrunk to 600 rows, on top of the upload held twice in memory (multipart in-memory form + io.ReadAll copy). FIX: upload streams to media/.upload-* while hashed (25 MB cap), multipart spills to DATA_DIR/tmp past 1 MB (TMPDIR set at boot, swept on boot), EXIF read bounded to 2 MB, jpeg.DecodeConfig first, MEGAPIXEL CAP = 60 MP (refusal text: "photo is N MP (W×H); the limit is 60 MP. The phone''s HEIF→JPEG export at Most Compatible is fine, or share a smaller copy."), one jpeg.Decode, thumbnail = integer box average + ApproxBiLinear (no working buffer), images dropped + debug.FreeOSMemory before the DB write, debug.SetMemoryLimit at 75% of cgroup memory.max or MemTotal (GOMEMLIMIT env wins). AFTER, VmHWM: 12 MP 40 MB, 48 MP 4:2:0 91 MB, 48 MP 4:4:4 163 MB — all land at 256m AND 512m, nothing OOM-killed; 102 MP refused cleanly at 20 MB peak. PIN LOG LINE proven locally: "post 1: pin browser ±11 m → snapped to checkpoint 1 (Hudson Bend (home))", "pin browser ±9 m" (West Texas, no snap), "pin exif → snapped to checkpoint 3 (Cloudcroft, NM)", "pin checkpoint 1 (Hudson Bend (home)) (fallback)", "pin none (hidden)"; plus one "photo <sha>: W×H MP MB, orientation, thumb WxH, exif gps=" line per photo. gofmt + go vet clean. NOT VERIFIED: Kris''s phone re-post of the same photo on v15 — the orchestrator closes this after that; watch `flyctl logs -a roadtrip-clodemode` for the photo + pin lines.'
