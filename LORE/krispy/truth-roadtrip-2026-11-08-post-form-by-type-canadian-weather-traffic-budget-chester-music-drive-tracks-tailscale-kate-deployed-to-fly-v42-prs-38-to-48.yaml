  - deploy
  - checkin
  status: design
  description: |-
    Shipped on clodemode/RoadTrip trunk 9691651, merged by Kris: 38 FreeLance test clock pinned (date dependency, production unchanged); 39 Chester search_music and show_music with album cards and a 56 px Play link, chester-rt-10; 40 Start the drive legible on the home banner; 41 Weather falls back to Environment Canada GeoMet when NWS answers 400 out of bounds; 42 Trip-mode traffic chips: within 1 km of the line, nearest three ahead, then one summary, computed per request from a 10 minute cache; 43 post form by type, start mode, More options, location reason and fresh fix on photo pick; 44 Drive Tracks button; 45 a note with no photo does not check in or step the car; 46 the form never picks No pin by itself; 47 a start lands on the driver screen with a green confirmation and the submit button shows progress; 48 a one-day trip reads Today. musicorgan PR 75 made the album page's Play album button 56 px, merged and live on the local about-musicorgan-1 only.
    Fly: v42 deployed by workflow plan then apply at 2026-11-08 20:21 UTC, healthz 200, migrations added skipped_at and skip_reason, sim off, MELT off (no Redis on Fly, accepted by deploying), roadtracks and chester on, active ride ygk-atx-2026-11.
    KATE: roadtrip:kate-9691651 on :8089, test ride kgn-yyz-test reset, reachable at https://clode-mode.tail2556d2.ts.net (tailscale serve 443 to 8089, 8443 to 8810, tailnet only). ROADTRACKS_LINK_BASE in data/kate.env is https://clode-mode.tail2556d2.ts.net:8443. Rebuild recipe unchanged; use docker stop then rm; reset with the canonical refresh workflow.
  dont: 'DONT read Fly v42 as proven on a real phone: nobody has yet posted from a phone on Fly or tested
    GPS over the https KATE address after this round; only the browser pane and tests have. DONT read
    a real Chester music question as tested: every Chester test is stubbed. DONT read MusicOrgan''s big
    album Play button as on music.opeongo.net: PR 75 is not deployed to Fly. DONT trust the 165 mi planned
    figure next to the 156 mi Left: they differ after the start and the cause is not known. DONT tap Start
    the drive on the KATE for a real-GPS drive: it starts the simulated car, whose position overrides
    real GPS. DONT read the push gate''s exit 0 as a verdict for RoadTrip this round: it printed none
    and recorded no board row; the proof is the plain-clone suite.'
  do_this: 'VERIFY on the KATE signed in: home badge and driver day gauge read Today; /driver/post opens
    as Start the drive with only the upload; a no-GPS JPEG started the drive lands on /driver with a green
    "Drive started from Kingston" and the car steps per photo, Napanee reached on the second photo after
    the start. A live Weather call for Kingston read "no active alerts" and a point inside a real Environment
    Canada alert showed the alert. TomTom''s incident geometry returned as LineString [lng, lat]. On a
    full simulated drive to Toronto the screens stayed coherent at 375 px, no console errors.'
