  title: 'roadtrip 2026-11-08: PRs 38 to 48 shipped and deployed as Fly v42 (trunk 9691651): Chester''s
    music cards with a Play button, Canadian weather from Environment Canada, on-route traffic chips nearest
    first, the post form by type, Start confirming on the driver screen, Drive Tracks, Today badge; the
    KATE reachable over Tailscale HTTPS; real phone GPS over HTTPS not yet tested'
  domain: truth
  lore_type: truth
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - driver
  - kate
  - tailscale
