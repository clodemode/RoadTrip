entries:
- slug: todo-roadtrip-add-app-profile-yaml-at-the-repo-root-so-about-reads-its-venue-paths-instead-of-hardcoding-them
  title: 'RoadTrip: add APP_PROFILE.yaml at the repo root (Go static binary on Fly, /data volume) so ABOUT
    reads its venue facts from the app'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: packaging
  character_slug: krispy
  tags:
  - app-profile
  - platform
  - paths
  - fly
  - packaging
  - go
  status: design
  description: 'Filed 2026-10-09 by codi-ab-app-profile-v1-2026-10-09 when ABOUT gained the APP_PROFILE
    loader (INTENT/TOOLS/_app_profile.py, MCP app_profile; clodemode/formicary APP_PROFILE.yaml is the
    worked example). RoadTrip is bind-mounted at /app/fleet/roadtrip but is not a compose include, so
    it is NOT on ABOUT''s MISSING_PROFILES ratchet (the ratchet covers compose-included apps). A Go binary
    has no manage.py: fly.code_dir is meaningless for it, local/test sections may not apply; the v1 schema
    allows that (every section is optional).'
  dont: DONT put private text (the private.json overlay contents), a secret or a token in the profile.
    DONT invent a Django-style code_dir for a Go binary.
  do_this: 'DO add roadtrip/APP_PROFILE.yaml (profile_version 1, app: roadtrip, repo, fly: app/region/data_dir/volume),
    point its README/AGENTS.md at it, verify with app_profile(app=''roadtrip'').'
  depends_on:
  - spec-clode-every-target-app-declares-its-own-venue-paths-in-an-app-profile-at-its-repo-root-and-about-reads-them-never-hardcodes-them
