entries:
- slug: ruling-roadtrip-the-site-stays-public-during-the-2026-11-trip-and-the-checklist-names-no-person-private-places-stay-fuzzed
  title: 'RULED by Kris 2026-11-06: the site stays public during the 2026-11 trip (SITE_VISIBILITY unchanged),
    and the public checklist says "the current owner", never a person''s name; private places stay fuzzed
    and identifying details stay signed-in only'
  domain: lore
  lore_type: guidance
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - ruling
  - visibility
  - privacy
  - checklist
  - 2026-11
  status: canonical
  description: 'Two rulings from the thread that loaded the 2026-11 trip, both asked as a question with
    a recommendation. (1) Visibility: asked whether the site should go private while on the road, as it
    was during the first ride, Kris ruled "Stay public". The plan, the departure date and the route options
    are therefore visible to anyone; the protections that remain are the fuzz of private places, the 8
    km mask on leg lines near them, and signed-in-only surfaces. (2) Checklist wording: asked whether
    the public checklist should name the person the car comes from, Kris ruled "Say current owner". He
    also ruled that personal details such as a vehicle identifier never appear on the public site, while
    the import plan itself is public content meant to help the next person.'
  dont: DONT flip SITE_VISIBILITY to private for this trip without a new ruling. DONT put a person's name,
    a vehicle identifier, a plate, an insurer or a value in a public checklist field or outcome note.
  do_this: Keep private places fuzzed and identifying details in the private fields. Write public outcome
    notes as advice to a stranger.
  do_also: The earlier ruling ruling-roadtrip-site-is-private-until-kris-opens-it-and-pins-are-precise-except-at-private-places
    still governs pin precision.
