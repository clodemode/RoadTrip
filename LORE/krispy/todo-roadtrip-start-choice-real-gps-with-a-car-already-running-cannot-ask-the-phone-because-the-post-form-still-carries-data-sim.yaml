entries:
- slug: todo-roadtrip-start-choice-real-gps-with-a-car-already-running-cannot-ask-the-phone-because-the-post-form-still-carries-data-sim
  title: 'roadtrip KATE: choosing Real GPS at Start while a simulated car is already running can only
    use the photo''s own GPS, because the post form opened with data-sim and never asks the phone'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - driver
  - kate
  - start
  - gps
  - duplicate-override
  status: design
  description: |-
    Found by codi-roadtrip-start-choice-2026-11-08 on PR 54. The server is correct: Real GPS stops the car before vouching. On the page, post.js reads data-sim="1", set while a car runs, so the phone location is not asked. With no car running when the page opens, the phone is asked as normal. KATE only: Fly has no simulated car. Workaround: stop the car and reopen the form.

    Duplicate override 2026-11-08: The candidate is the Start choice itself, which PR 54 ships and closes; this is a page-side gap that remains after it.; candidates: todo-roadtrip-kate-start-the-drive-always-starts-the-simulated-car-so-a-real-gps-trip-mode-drive-on-the-kate-needs-a-way-to-opt-out (0.615)
  dont: DONT send the simulated position to the browser as coordinates. DONT change behaviour where SIM_ALLOWED
    is unset.
  do_this: In post.js, when start_source=gps is chosen, drop the simulated-position behaviour for this
    form and ask the phone. Gherkin scenario plus a node test in static/js.
  effort: S
  impact: low
  triaged_at: '2026-11-08T20:58:21.553985+00:00'
  triaged_by: krispy
