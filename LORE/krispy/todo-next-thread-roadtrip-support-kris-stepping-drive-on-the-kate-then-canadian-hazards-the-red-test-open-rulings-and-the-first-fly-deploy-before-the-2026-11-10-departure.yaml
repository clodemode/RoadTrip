  title: 'TODO-NEXT, roadtrip (start on Opus, thin tokens): support Kris''s stepping-car drive on the
    KATE and fix what he hits, then the red FreeLance test, the Canadian hazards and chip budget, the
    open rulings, the sim fall-backs, MELT on Fly and the first Fly deploy of the round when Kris says,
    before the 2026-11-10 departure'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - next-thread
  - driver
  - kate
  - checkin
  status: design
  description: |-
    agent_start(app_scope='roadtrip', lair='all', tag='driver'). The truth stone truth-roadtrip-2026-11-08-toronto-test-drive-round-start-the-drive-photo-check-ins-stepping-sim-letter-and-unit-marks-hours-stick-fuzz-this-shipped-prs-29-to-36 holds what shipped, Kris's rulings and how to verify.
    STATE at 2026-11-08 12:35 UTC (7:35 AM EST): clodemode/RoadTrip trunk bc31628 (PRs 29, 30, 31, 33, 34, 35, 36 merged by Kris; 32 closed, folded into 33). Fly is v41 (ba595e8), NOTHING of the last two rounds is deployed; the machine is already 1024 MB and the volume 3 GB. roadtrip-kate runs roadtrip:kate-fuzz on :8089, phone at http://192.168.40.176:8089, env roadtrip/data/kate.env (now with ROADTRACKS_TOKEN, ROADTRACKS_BASE=http://musicorgan:8000, ROADTRACKS_LINK_BASE=http://192.168.40.176:8810; the matching MO_ROADTRACKS_TOKEN is in musicorgan/.env). The drive is reset and dated 2026-11-08: if the next thread opens on a later date, POST /driver/plan start=<today> or the badge reads Arrived. Rebuild recipe: docker build -q -t roadtrip:kate-x . in the worktree, docker rm -f roadtrip-kate, docker run -d --name roadtrip-kate --network about_default -p 8089:8080 --env-file data/kate.env -v "$PWD/data/kate:/data" roadtrip:kate-x from the roadtrip checkout. A restart drops the sim car.
    NEXT, in order: (1) whatever Kris hits on the stepping drive (check-ins land on posts 3, 5, 7): one PR per fix, Gherkin first on godog. (2) todo-roadtrip-freelance-candidates-kept-test-fails-on-trunk-8323c75-along-asked-again: trunk's full suite is red on this one test; find out whether it depends on the date, before the deploy. (3) todo-roadtrip-hazard-chips-read-unknown-error-on-a-canadian-route-the-weather-source-is-us-only-and-traffic-failed-on-the-401-leg (departure 2026-11-10 starts in Ontario). (4) todo-roadtrip-driver-screen-traffic-chips-need-a-budget-the-day-1-leg-rendered-150-closure-chips-and-146-more. (5) Ask Kris to rule, as questions with pro/con: music on /driver, mini-player vs the RoadTracks link-out (link-out recommended, he has not ruled); HTTPS for real GPS on the KATE via Tailscale serve vs LAN HTTP with the sim; ETA rounding taken as 5 minutes without a ruling; the "Day 1 of 1" badge on a one-day trip vs "Today" (recommended); whether a default fuzz at a private stop should keep the exact point (it does; he was told and has not objected); the DriveTrack close, todo-roadtrip-drivetrack-soundtrack-from-musicorgan-shared-key-so-chester-can-pick-live-and-planned-driving-music proposed superseded by RoadTracks PR 11 and the Chester RoadTracks tool row. (6) todo-roadtrip-chester-send-my-position-and-the-post-form-phone-pin-still-ask-the-browser-fall-back-to-the-server-held-sim-position-and-drop-the-dead-arrive-strip-css: the post half is done by PR 33, Chester's Send my position and the dead CSS remain. (7) todo-roadtrip-check-in-needs-a-vouching-position-test-only-seams-and-reroute-ui-follow-ups. (8) todo-roadtrip-melt-on-fly-needs-a-file-sink-like-fintracks-melt-sink-py-since-the-machine-has-no-redis before the deploy, or accept MELT-off on prod for this trip. (9) The first Fly deploy, only on Kris's word: gh workflow run deploy.yml --ref trunk -f mode=plan, then apply; SIM_ALLOWED stays unset on Fly; new columns (skipped_at, skip_reason, exact_lat, exact_lng, exact_source) and the places table migrate on boot; ROADTRACKS_LINK_BASE stays unset on Fly. Verify a real phone: Start the drive, a camera photo pinned by real GPS, Fuzz This. The real trip ygk-atx-2026-11 needs a planned line for the hours stick.
    BUILDERS: Sonnet, brief names files and line ranges, one RED/GREEN cycle plus a RED control, report at most 25 lines, never git stash. Planning audits on Fable. Kris merges; hand him one PR at a time.
  dont: DONT open the KATE's SQLite database from the Mac while the container runs. DONT delete KATE posts
    by a time window. DONT deploy without Kris's word. DONT start a sim on Fly. DONT send a photo to Chester
    or take an upload from anyone not signed in without a new ruling.
