entries:
- slug: todo-roadtrip-leg-polyline-vertex-defeats-the-cloudcroft-checkpoint-fuzz
  title: 'roadtrip: a fuzzed checkpoint''s own leg LineString ends at the UN-snapped seed vertex, so the
    polyline hands back the point the checkpoint fuzz just removed (Cloudcroft; Hudson Bend is fine)'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: data
  character_slug: krispy
  tags:
  - roadtrip
  - atx-sjc
  - privacy
  - fuzz
  - seed
  - geojson
  - spring-2026-09
  status: shipped
  description: 'Found 2026-09-02 while verifying the pin-choice work (roadtrip fc2c733 / Fly v16). Checkpoint
    3 "Cloudcroft, NM" is precision=fuzzed, and the store correctly snaps it to 32.95/-105.75 on the way
    out — but leg 1''s LineString ENDS at, and leg 2''s BEGINS at, the seed''s un-snapped vertex [-105.742,
    32.957], which ships in window.RIDE and in /route.geojson. An anonymous grep of the timeline HTML
    finds 32.957 twice for exactly this reason. So the 0.05 deg snap on that checkpoint buys nothing:
    the polyline terminus names the same point to within ~800 m. Checkpoint 1 (Hudson Bend) is NOT affected
    — leg 1''s line starts at the already-snapped [-97.95, 30.4]. Both values are seed-owned, planning-grade
    town/junction points rather than street addresses, so this is a weakened fuzz and not an address leak
    — but it is the fuzz not doing its job, and the fuzz exists because checkpoint 3 is a rented cabin.
    Pre-existing; not introduced by the pin-choice commit.'
  dont: Don't "fix" it by deleting the vertex — a leg line that stops short of its own terminus draws
    a visible gap on the map. Don't hand-edit the stored rows either; planning data is seed-owned and
    refreshed on every boot until a checkpoint is actualized, so a DB edit is overwritten by the next
    deploy.
  do_this: 'Snap the polyline endpoints the same way the checkpoints are snapped: in store.go, where a
    leg''s Line is read out, replace any vertex that falls within a fuzzed checkpoint''s cell with that
    checkpoint''s snapped point (or apply snap() to the first and last vertex when they match a fuzzed
    checkpoint). Do it on the way OUT, like scanCheckpoint, so the seed stays the seed. Verify with an
    anonymous curl of /route.geojson and of / — neither may contain 32.957 or -105.742 — and eyeball leg
    1 and leg 2 on the map for a gap at Cloudcroft.'
  do_also: Low stakes while SITE_VISIBILITY=private (nothing is anonymous right now), which is why this
    is filed rather than folded into fc2c733. It becomes real the moment Kris flips visibility back to
    public — do it before that flip, not after.
  closed_by_actor: 1feba0cc-eca0-4d49-8bc9-5d199ba4a9b6
  closed_at: '2026-11-06T22:24:28.921094+00:00'
