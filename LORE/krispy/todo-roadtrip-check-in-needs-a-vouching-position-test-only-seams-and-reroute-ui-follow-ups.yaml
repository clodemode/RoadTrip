entries:
- slug: todo-roadtrip-check-in-needs-a-vouching-position-test-only-seams-and-reroute-ui-follow-ups
  title: 'roadtrip: a photo''s check-in has no on-form feedback before posting (which stop it will hit),
    and the post form still carries post.js milestone-suggest code for radios that no longer exist'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: surface
  character_slug: krispy
  tags: []
  status: design
  description: 'Follow-ups from the start-drive / photo check-in change: (1) static/js/post.js suggestMilestone
    and the label[data-lat] wiring now only ever see the Start the drive label; the nearest-stop hint
    is dead for check-ins. Either retire it or show "this photo will check in at <stop>" from the open
    stops. (2) The check-in notice is the only feedback; a photo near no stop says "Posted as a photo;
    next stop X, N km". (3) A skipped stop is not yet shown anywhere on the public page (route.geojson
    / day list).'
