  description: |-
    THE TODO-NEXT for the atx-sjc ride (Kris's word for the handoff row, 2026-09-02; the file NEXT_THREAD_PROMPT_ATX_SJC_ROAD.md it replaced is deleted). Cold start: codi_orient(session='atx-sjc-road-<date>-<hhmm>', klass='orchestrator', app_scope='bloodride', tag='atx-sjc', cwd=/Users/kris/projects/CLODE, branch=trunk, stale_seconds=900) and READ `active` — two sessions ran the predecessor concurrently on 2026-09-02 and collided on roadtrip/; a second atx-sjc-* orchestrator means stop and split. Then lairs_lore_get('ruling-roadtrip-site-is-private-until-kris-opens-it-and-pins-are-precise-except-at-private-places') and ('spec-bloodride-atx-sjc-2026-09-live-ride-surface-go-or-django').

    WHERE THINGS ARE (2026-09-02 12:00Z, all verified by anonymous curl, never by a deploy's own verdict). CLODE/roadtrip/ = github.com/clodemode/roadtrip (PRIVATE, trunk, clean), Fly roadtrip-clodemode release v16 at commit fc2c733, 512 mb, suspend, canonical host https://roadtrip.opeongo.net.
    THE SITE IS PRIVATE: SITE_VISIBILITY=private in fly.toml puts every page behind the one admin password; /, /photos and /route.geojson answer 302 to /admin/login, /healthz answers 200 so Fly keeps the machine in service, and the login page plus its two static files stay open. Kris ruled this TEMPORARY — "we will open it later" — and re-opening is that one line set to "public" plus a redeploy.
    PINS: exact everywhere except at a private place. One "Fuzz location" toggle on every post owns the seam, default computed per post (ticked inside a fuzzed checkpoint's cell, clear elsewhere), overriding either way; PIN_PRECISION=snap sets only that default at a private place. The post form reads the photo's EXIF GPS in the BROWSER and shows it before posting, a radio picks the source (photo GPS / phone / checkpoint / none), a plain line says what will be published, a signed-in-only line on each post shows the raw fix beside what was published, and each post carries a re-pin control. Column is pin_fuzzed.
    LOG WORDING CHANGED — grep for the new strings, not the old: `post N: pin exif → fuzzed to checkpoint 1 (Hudson Bend (home))`, an override reads `pin exif (chosen) (exact, fuzz off) at checkpoint 1 (…)`, and boot logs `site visibility: private (…)` and `pin precision: snap (…)`.
    The 2026-09-02 00:49Z OOM is fixed and PROVEN on Kris's own phone: his 24.5 MP / 12.6 MB post landed on v15 at 01:20Z. Lodging: ONLY Cloudcroft (checkpoint 3) is set, in data/private.json on the volume; Flagstaff (4), Mammoth (5) and San Jose (6) are placeholders.
  dont: Don't write to roadtrip/ while another CODI or session holds it — gate on codi_ledger_query codi_complete + clean porcelain. Don't put any street text in the seed or the repo (pattern-go-microvm-private-overlay-json-on-data-volume-never-in-repo). Don't judge the driveway GPS test by the map pin; read the post's pin line in flyctl logs. Don't run this handoff in two sessions.
  do_this: 'In order. (1) Kris re-pins post 3 from the phone with the new control — it is the photo he uploaded from Hudson Bend at 01:20Z, currently fuzzed to checkpoint 1; nobody but Kris should touch it. (2) The driveway browser-geolocation test, which now has a provable tell: the form''s status line must read "location: on (±N m)" and `flyctl logs -a roadtrip-clodemode` must show a `pin browser` line — closes todo-roadtrip-phone-verify-browser-geolocation-pin-before-departure. (3) When Kris supplies them: Flagstaff + Mammoth lodging pins and the San Jose address — public name/label/pin into roadtrip/seed/atx-sjc-2026-09.geojson, street text into data/private.json keyed by checkpoint ord, sftp to the volume, flyctl deploy, verify /route.geojson (signed in, since the site is private) and the boot log''s ''planning refreshed'' line — closes todo-roadtrip-seed-data-items-before-departure-lodging-pins-geocode-tioga. (4) BEFORE the site is ever flipped public, two blockers: todo-roadtrip-leg-polyline-vertex-defeats-the-cloudcroft-checkpoint-fuzz (leg 1''s LineString still ends at the un-fuzzed Cloudcroft seed vertex, handing back within ~800 m what the checkpoint fuzz removes) and todo-roadtrip-review-every-stored-posts-precision-before-flipping-site-visibility-to-public. (5) Cosmetic, only if time remains: masthead badge wrap, inline Odo SVG, private-snap leg re-derive, og:image raster card, seed leg caveat. The navigation redesign is specced but unbuilt: spec-roadtrip-mark-stones-rail-and-lance-leg-navigation, whose session died with nothing on the tree. Thread end: codi_ledger_record with every slug consulted.'
  do_also: 'After the trip: todo-bloodride-retire-the-ride-rsync-to-memewears-now-that-roadtrip-opeongo-net-is-live, todo-roadtrip-post-trip-migrate-fredberg-and-blance-seeds-decide-django-bloodride-drive-lens-only, todo-bloodride-django-drive-and-ride-pages-lore-character-dress-up-after-atx-sjc. ON THE ROAD (Kris): the site asks for the password on every page now, not just posting, and anyone you share the link with sees the login until you open it. Sign in at https://roadtrip.opeongo.net/admin/login. Best pin: choose from Photo Library, which keeps the photo''s own GPS and time. One tap "arrived" on each checkpoint stamps the day. JPEG only (Camera → Formats → Most Compatible). ABOUT loose end, not this thread''s: 95 date-stamped teaser bake outputs left modified and uncommitted (todo-teaser-bake-all-date-rolled-cache-buster-dirties-every-page-across-a-utc-day-boundary), and the intent suite has been RED since 00:58Z (todo-about-intent-suite-red-since-2026-09-02-...). NAMING: Kris calls this row a TODO-NEXT; the shared workflow row minted on 2026-09-02 still describes the family as "a todo row tagged next-thread", so align that wording when someone owns it.'
