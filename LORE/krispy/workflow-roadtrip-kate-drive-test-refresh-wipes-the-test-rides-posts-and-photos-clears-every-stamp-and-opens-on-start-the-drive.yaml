entries:
- slug: workflow-roadtrip-kate-drive-test-refresh-wipes-the-test-rides-posts-and-photos-clears-every-stamp-and-opens-on-start-the-drive
  title: 'roadtrip KATE drive-test refresh: wipe the test ride''s posts AND photos (rows and media files),
    clear every arrival and skip stamp, stop the sim, so the phone opens on the Start the drive button
    (Kris, 2026-11-07)'
  domain: lore
  lore_type: workflow
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - kate
  - driver
  - checkin
  - refresh
  status: canonical
  description: 'Kris ruled, 2026-11-07, during the Kingston-to-Toronto pretend drive on roadtrip-kate:
    "Remember to wipe posts and photos during Kate refresh for the drive test. Start with a Start Drive
    button." A refresh for a drive test is a clean slate. It leaves no posts or photos from earlier runs
    on the test ride, no arrived_at or skipped_at stamps, and no running sim. The first screen the phone
    shows is the large Start the drive button. That button is on the home page and on /driver, from PR
    33.'
  dont: 'DONT delete posts by a time window or a guessed id range. On 2026-11-07, a time-window clean-up
    of the orchestrator''s own five test posts also deleted two of Kris''s posts. They were restored by
    hand from the surviving photo rows. Select by the test ride''s legs, or by the exact ids you created.
    DONT wipe a photo that a post on ANOTHER ride still uses. DONT expect the sim car to survive a container
    restart: it lives in memory, so any docker stop/rm/start drops it, and the next Start the drive starts
    it again.'
  do_this: |-
    With R=kgn-yyz-test and DB=roadtrip/data/kate/roadtrip.sqlite3, take these steps.
    (1) Stop the KATE: `docker stop roadtrip-kate`.
    (2) Delete the media file and its thumbnail under data/kate/media/ for every photo NOT used by a post on another ride. Get the paths from `SELECT path, thumb_path FROM photos WHERE id NOT IN (SELECT photo_id FROM posts p JOIN legs l ON l.id=p.leg_id WHERE l.ride_slug<>'R' AND photo_id IS NOT NULL)`.
    (3) Run in sqlite3:
    - `DELETE FROM posts WHERE leg_id IN (SELECT id FROM legs WHERE ride_slug='R')`
    - `DELETE FROM photos WHERE id NOT IN (SELECT photo_id FROM posts WHERE photo_id IS NOT NULL)`
    - `UPDATE checkpoints SET arrived_at='', skipped_at='', skip_reason='' WHERE leg_id IN (SELECT id FROM legs WHERE ride_slug='R')`
    (4) Start the KATE again, either with `docker start roadtrip-kate` or with the truth stone's docker run line (env-file data/kate.env, volume data/kate, network about_default, port 8089) on a rebuilt image.
    (5) Check that /driver shows "Start · <start>" and the Start the drive button. No sim should be running: /driver/sim.json returns running:false.
  do_also: 'A todo-worthy upgrade: a `-reset-ride <slug>` flag on the binary (or POST /driver/ride/reset,
    trip-keeper only, refused unless SIM_ALLOWED=1) that does steps 2-3 in one transaction, so nobody
    hand-writes SQL against a KATE. On a KATE the stepping car (PR 33) moves one step per post: post 1
    is the start, then halfway, then the stop, and so on. So in a test plan the check-ins fall on posts
    3, 5, 7 and onward.'
