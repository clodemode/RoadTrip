entries:
- slug: todo-roadtrip-per-ride-visibility-site-visibility-is-one-switch-for-the-whole-site-so-a-new-trip-cannot-be-private-while-an-earlier-one-is-public
  title: 'roadtrip: per-ride visibility, because SITE_VISIBILITY is one switch for the whole site and
    a trip pushed to the volume inherits whatever the last trip was opened to'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: surface
  character_slug: krispy
  tags:
  - visibility
  - per-ride
  - active-ride
  - 2026-11
  status: design
  description: 'Found 2026-11-06 while building spec-roadtrip-trip-files-live-on-the-data-volume-with-day-level-route-options-a-planner-page-and-code-under-app-2026-11-06.
    SITE_VISIBILITY (fly.toml [env], handlers.go visibility) is public or private for the WHOLE site and
    changes only by a redeploy. The site was opened to the public after the first ride''s precision review.
    A new trip now arrives by push and goes live the moment it is activated, with no deploy, so it is
    public at once if the site is public: its plan, its options, its start date and every alternative
    road on /plan and /plan.json. The trip-keeper has no way to keep a trip closed while it is still being
    planned, or to open one ride and keep another closed, short of flipping the whole site and redeploying.'
  dont: 'DONT add a second credential or a second auth path: there is one admin password, one session
    and the push token, all answered by Auth.IsAuthed. DONT put /healthz, the login page or its two static
    files behind a per-ride gate. DONT make visibility a property of the trip document alone, where a
    re-push could open a ride by accident.'
  do_this: 'DO store visibility per ride as data beside the active-ride key (the meta table), set by an
    authenticated call and read per request in the same middleware that reads SITE_VISIBILITY, with SITE_VISIBILITY=private
    still closing everything. A pushed trip starts private until the trip-keeper opens it. Prove it the
    way the site-wide gate is proved: an ANONYMOUS request for /, /plan, /plan.json and /route.geojson
    is a 302 to the login while the active ride is private, and /healthz stays 200.'
  do_also: 'Related: ruling-roadtrip-site-is-private-until-kris-opens-it-and-pins-are-precise-except-at-private-places
    (the site-wide ruling this refines) and the past-trips index row.'
  effort: M
  impact: high
  triaged_at: '2026-11-06T19:53:49.061704+00:00'
  triaged_by: krispy
