  status: design
  description: |-
    Verified 2026-11-07 in the built-in browser, signed in as kris, phone viewport, roadtrip.opeongo.net.
    - Deploys (all through deploy.yml gates): v38 bf7e92a (PR 14 hud.js syntax fix + PR 15 ?sim= drive), v39 10b3066 (PR 16), v40 76da30c (PR 17 hud.js first-fix race fix + js tests in the deploy gate), v41 ba595e8 (PR 18 along-route privacy mask, PR 19 Aimless + chester-rt-7/freelance-picks-4, PR 20 checklist tick).
    - /driver on v38+: console clean, sim.js before hud.js, weather and traffic chips resolve, RoadTracks search for 'neil young' returned MusicOrgan albums with no reload and no layout shift (body height 2138 px before and after).
    - Trailer Test on v40: rung 1 position request 0.41 s after load, HUD Day 4 of 4, 471 mi done, Hudson Bend 6 mi; rung 100 Austin to San Antonio: on route at start, then off route the HUD fell back to Day 1 / Thousand Islands (filed as todo-roadtrip-driver-screen-says-off-route-instead-of-silently-showing-todays-plan-leg-when-the-fix-is-far-from-every-leg).
    - Aimless on v41: 10 mi sim counted '10 mi driven this session', chips near the car, no plan stop; mode returned to Trip after.
    - Checklist on v41: ticking open step bill-of-sale opened its Mark done form with focus in What happened and made no POST; progress unchanged at 1 of 20 after closing it.
    Ruled today: calculateRoute origin stays raw (car routing is precise).
