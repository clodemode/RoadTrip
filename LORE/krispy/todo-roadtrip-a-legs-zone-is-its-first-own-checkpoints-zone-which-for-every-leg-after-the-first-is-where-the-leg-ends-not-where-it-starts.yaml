entries:
- slug: todo-roadtrip-a-legs-zone-is-its-first-own-checkpoints-zone-which-for-every-leg-after-the-first-is-where-the-leg-ends-not-where-it-starts
  title: 'roadtrip: Leg.TZ is documented as the zone a leg STARTS in but is read from the leg''s first
    own checkpoint, which for every leg after the first is the stop the leg ends at, so "today" for a
    leg that crosses a zone line is judged in the wrong zone'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: logic
  character_slug: krispy
  tags:
  - timezone
  - day-of-trip
  - legs
  status: design
  description: 'Found 2026-11-06 while reading the ride model for spec-roadtrip-trip-files-live-on-the-data-volume-with-day-level-route-options-a-planner-page-and-code-under-app-2026-11-06.
    Store.Legs (store.go) sets Leg.TZ from the leg''s first checkpoint, and the Leg struct''s comment
    says that is the zone the leg starts in. But the boundary checkpoint between two legs belongs to the
    EARLIER leg (handlers.go legOrigin says so in words): leg 2''s own checkpoints begin with the stop
    it arrives at. So for leg 1 the zone is the start''s, as documented, and for every later leg it is
    the terminus zone. dayOf uses Leg.TZ to decide which leg is "today" and defaultTZ falls back to it
    for the post form. On a leg that crosses a zone line the day-of-trip badge and the default leg for
    a new post therefore roll over an hour early or late around local midnight. Small, and pre-existing:
    it predates the trip-file work and was not changed by it.'
  dont: 'DONT fix it with a ride-wide zone: times are UTC plus the zone they happened in and there is
    no ride-wide zone. DONT move the boundary checkpoint to the later leg to make the comment true: posts,
    arrivals and the open data all rely on it belonging to the earlier leg.'
  do_this: 'DO set Leg.TZ from legOrigin (the previous leg''s terminus, or the leg''s own first checkpoint
    for leg 1) so it is the zone the leg starts in, as the comment claims. Add a test on the embedded
    seed, which crosses three zone lines: for a leg whose origin and terminus are in different zones,
    an instant that is the leg''s date in the origin zone and the day before in the terminus zone is "today"
    for that leg.'
  effort: S
  impact: low
  triaged_at: '2026-11-06T19:54:27.758448+00:00'
  triaged_by: krispy
