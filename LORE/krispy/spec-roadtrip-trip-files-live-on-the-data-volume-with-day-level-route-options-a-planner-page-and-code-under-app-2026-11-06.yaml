entries:
- slug: spec-roadtrip-trip-files-live-on-the-data-volume-with-day-level-route-options-a-planner-page-and-code-under-app-2026-11-06
  title: 'roadtrip 2026-11: a trip file lives on the /data volume and is pushed by the trip-keeper, never
    baked into the public repo; a trip may carry day-level route options and an optional overnight stop;
    a planner page switches them with live mileage; code sits under /app'
  domain: lore
  lore_type: spec
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - trip-file
  - data-volume
  - options
  - planner
  - app-profile
  - public-repo-guard
  - 2026-11
  status: shipped
  description: |-
    Kris, 2026-11-06: a second trip is loaded before a departure the following week. The repo is PUBLIC, so this pass moves trip data off the code release. This row is written as if public: it names no place, date of travel or person.

    A. TRIP FILES ON THE VOLUME. Boot loads the embedded seed/*.geojson (history, unchanged) and then every $DATA_DIR/trips/*.geojson through the same Seed / RefreshPlanning path. POST /admin/trip (session or PUSH_TOKEN bearer, the /admin/private conventions) takes one whole trip document, parses it fully before writing, writes it atomically to $DATA_DIR/trips/<slug>.geojson and seeds or refreshes at once, because a suspended machine never re-runs boot. The slug is validated to [a-z0-9-]. The active ride is a meta key set by an authenticated call, resolved per request, falling back to RIDE_SLUG; an earlier ride stays in the database untouched.

    B. OPTIONS. A trip document is the existing seed GeoJSON shape plus an optional top-level options list (id, title, default, choices) and avg_mph / long_day_hours. A feature carrying option + choice belongs to that choice only; a feature without them is fixed. Parsing takes a selection (file defaults, overridden by the stored selection) and yields the same planning rows as before, so legs, checkpoints, leg pages, posts and tracks work unchanged. A choice may add a day and a checkpoint. A leg date may be derived from the ride start date plus its day, and the start date is part of the stored selection so a departure can move by one field. est_hours = miles / avg_mph; a day over long_day_hours is flagged as a long day.

    C. SELECTION IS GUARDED. A saved selection change is refused when it would drop or renumber an arrived checkpoint or drop a leg that holds posts. Arrived checkpoints, posts and photos are never touched.

    D. PLANNER PAGE. GET /plan: Leaflet on real tiles, each option group as in-place controls, the selected route solid, alternatives dashed grey and tappable, a day list with miles, hours and the long-day flag, trip totals, tap a day to zoom. A visitor's switch is local to their browser; the signed-in trip-keeper saves it. Every coordinate on the page comes out of the store's fuzz path, alternatives included.

    E. CONVERTER. The binary converts a planning-tool route document into a trip file (a flag beside -hash). It refuses a stop with no IANA zone. Its output goes to the gitignored local data dir and to the volume by push, never to the repo.

    F. GUARDS. .gitignore covers the handoff folder and the data dir; a test fails closed when a tracked file is a trip document outside the seed allowlist and testdata, or when a guard line is missing. Fixtures are synthetic.

    G. PATHS. The binary lives at /app/roadtrip, data at /data, and APP_PROFILE.yaml at the repo root declares them.

    Shipped: 2026-11-06, thread-rt-kingston-to-hudson-bend-trip-2026-11-06: Merged as clodemode/RoadTrip PR 1 (merge 19b27b9, 2026-11-06 21:13 UTC), deployed 21:33 UTC; the second trip was pushed to the volume by token and made active; 133 tests, a cold review and six fixes.
  dont: 'DONT commit a real trip document, a handoff folder or anything from the data dir. DONT add a
    trip to seed/. DONT name a private place, a travel date or a person in LORE, a commit message or a
    PR body: the repo is public. DONT render a coordinate that skipped the store''s fuzz path. DONT let
    a selection change touch an arrived checkpoint, a post or a photo. DONT add boot-time periodic work.'
  do_this: Build A to G on one branch with tests on a synthetic fixture and one deliberate RED control;
    verify in Docker (the host has no Go toolchain); push once; one PR. Deploy stays workflow_dispatch
    and is Kris's.
  do_also: 'Follow-ups are their own rows: the design-system restyle, the CHESTER helper, a past-trips
    index, per-ride visibility.'
