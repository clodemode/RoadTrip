entries:
- slug: todo-bloodride-roadtrip-clodemode-live-fly-app-has-zero-backup-of-any-kind
  title: 'RULED NOT NEEDED 2026-09-04: roadtrip-clodemode has no backup of any kind, and the operator has ruled that it does not need one — the gap is ACCEPTED, not unaddressed'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: data
  character_slug: krispy
  tags:
  - backup
  - restore
  - off-box
  - bloodride
  - roadtrip
  - fly
  - production-readiness
  - wave-3c
  status: shipped
  description: |-
    PROBED 2026-09-04 (codi-clode-offbox-backup-probe-2026-09-04, Wave 3c). roadtrip-clodemode is a Go static binary + SQLite + phone-uploaded photos on a single Fly volume (`roadtrip_data` at /data, see /Users/kris/projects/CLODE/roadtrip/fly.toml). It serves roadtrip.opeongo.net for the live "atx-sjc-2026-09" ride — the ride is IN PROGRESS as of this probe's date (2026-09-04).

    MEASURED: grep across the roadtrip repo (*.go, *.md, *.sh) for backup/off-box/sftp_pull/rclone returned zero hits. The repo has no LORE/ directory of its own; its planning lives under bloodride/LORE/ (app_scope=bloodride), and none of those ~20 roadtrip-tagged rows (spec-bloodride-atx-sjc-..., todo-roadtrip-phone-photo-post-oom-..., todo-roadtrip-review-every-stored-posts-precision-..., etc.) mention backup, restore, or a second copy. No scheduled task, launchd plist, or crontab entry targets it either. This app is NOT one of the seven apps named in this probe's dispatch, but it is the live production surface of the named app "bloodride" (bloodride itself has no prod Fly deployment — see the companion finding) and it is actively accumulating irreplaceable, non-regenerable data (rider-submitted photos, posts) RIGHT NOW.
  dont: DONT confuse this with bloodride's own docker-compose-only local instance (no prod DB, per project_bloodride_no_prod_db / ruling) — that ruling is about the Django bloodride app, not this Go satellite. DONT wait for the trip to end before building the pull — the exposure is live now (todo-roadtrip-phone-photo-post-oom-kills-the-256mb-vm-raise-memory-and-bound-the-jpeg-decode already documents one process-crash near-miss on this same volume, 2026-09-02, four posts lost to an OOM before the decode path was bounded).
  do_this: 'CLOSED BY OPERATOR RULING, 2026-09-04, Kris, verbatim: "we are not needing a backup of the ROADTRIP".


    The finding was surfaced with its full cost — a live Fly app taking road-trip photo posts that day, single volume holding SQLite plus phone-uploaded photos, no copy anywhere — and the operator ruled the gap ACCEPTED. That is a decision about his own data and his own risk, and it is recorded rather than argued.


    DO NOT REOPEN THIS as an unaddressed backup gap. A future readiness sweep, matrix pass or backup audit that rediscovers roadtrip-clodemode''s empty backup column must read this row and record it as RULED ACCEPTED, not as a finding. Re-raising a ruled acceptance is noise, and it is the specific way an audit trains its operator to stop reading audits.


    WHAT WOULD MAKE THIS WORTH ASKING AGAIN, and only these: the app taking on data that is not the trip''s own ephemeral record (a second purpose, another person''s content, anything with a retention obligation), or the operator asking for a capture directly. Absent that, the answer is settled.


    FOR THE READINESS MATRIX: roadtrip-clodemode''s D3 (backup + restore) cell is ACCEPTED-BY-RULING, which is a different state from PROVEN and a different state from NONE. A matrix that renders it as a red gap is misreporting an operator decision as a defect.


    The other five gaps found in the same 2026-09-04 probe are NOT covered by this ruling and remain open on their own rows: eagle_lake_rocks (one snapshot, 4 days stale, and its predecessor already lost its data once), formicary (none), mango (backups on the same volume as the DB), musicorgan (the authoritative Mac copy unmeasured), phome (script exists, nothing schedules it).'
  do_also: 'CONTEXT THE RULING WAS MADE IN, recorded so a later reader does not mistake it for a decision taken before the app mattered: Kris stated the same day, 2026-09-04, that ROADTRIP GOES LIVE AND INTO REAL USE THAT DAY. The acceptance is therefore a deliberate choice about a LIVE app carrying real trip data, made with that knowledge in hand — not a judgement about a dormant or experimental one. Weigh it that way if you are ever tempted to reopen it.'
