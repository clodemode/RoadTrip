entries:
- slug: ruling-roadtrip-site-is-private-until-kris-opens-it-and-pins-are-precise-except-at-private-places
  title: 'OPERATOR RULING 2026-09-02: the whole roadtrip site sits behind the existing password until
    Kris opens it, and pins are PRECISE everywhere except at private places, per post'
  domain: lore
  lore_type: guidance
  app_scope: roadtrip
  lair: packaging
  character_slug: krispy
  tags:
  - roadtrip
  - atx-sjc
  - privacy
  - auth
  - gps
  - pin
  - ruling
  - fly
  status: canonical
  description: |-
    HOW IT CAME UP. Kris posted a 24.5 MP photo from home on 2026-09-02 01:20Z; the Fly log read `exif gps=true` then `post 3: pin exif -> snapped to checkpoint 1 (Hudson Bend (home))`. He asked for the file's GPS to be "visible and selectable", then said "we can use precise GPS locations, we have a password on the site". THAT PREMISE WAS WRONG and was corrected with proof: only /driver was authenticated — anonymous curl got 200 on /, /photos and /route.geojson, the GeoJSON carried access-control-allow-origin *, there was no robots.txt (404), and the same hour's log showed a scanner probing /.env on the host. Kris then ruled, verbatim: "Put the whole site behind the password / we will open it later and we want to setup precise per post so we can protect personal locations, but be precise with public locations."

    THE RULING, TWO PARTS. (1) VISIBILITY: every page requires the existing admin session while SITE_VISIBILITY=private in fly.toml [env]; /healthz stays open (Fly's health check fails the machine otherwise) as do the login page and the few static assets it needs. Opening the site later is a config flip to "public" plus a redeploy, never a code change. While private, link previews and the open GeoJSON are unreachable to anyone not signed in — accepted deliberately. (2) PRECISION: a pin is EXACT everywhere by default; only a point inside or near a checkpoint marked precision=fuzzed is snapped, which is what nearPrivate already did. The snap is not widened. Each post can override in both directions, and the post form states which case it is in before the post is made. PIN_PRECISION governs the private-place default only.
  dont: 'Don''t read "the site has a password" as covering the public pages unless SITE_VISIBILITY=private
    is actually set and verified by an ANONYMOUS curl — the admin gate never covered them. Don''t put
    /healthz behind the gate. Don''t widen the snap to non-private points; public locations are meant
    to be exact. Don''t invent a second credential or Basic auth — there is one admin password and one
    session. Don''t treat the private posture as permanent: it is a temporary closure Kris will reverse.'
  do_this: 'Prove visibility with an anonymous request, never a signed-in browser: `curl -sI https://roadtrip.opeongo.net/`
    and `/route.geojson` must be 302 to the login while private, and `/healthz` must stay 200. When Kris
    rules the site open, flip SITE_VISIBILITY to public in fly.toml, redeploy, re-verify the same three
    paths, and record the reversal here.'
  do_also: 'Shipped by codi-roadtrip-pin-choice-krispy-2026-09-02 alongside the visible/selectable pin
    work (photo EXIF GPS shown at file-pick time, a pin-source radio, a "publishes as" line, an admin-only
    raw-fix line, and re-pin on an existing post). Related: pattern-go-microvm-private-overlay-json-on-data-volume-never-in-repo
    (street addresses live in private.json on the volume, never in the repo) and todo-roadtrip-road-side-residuals-before-departure-2026-09-04
    (the road-side handoff).'
