entries:
- slug: todo-roadtrip-private-snap-re-derive-post-leg-when-fuzzed-checkpoint-is-on-another-leg
  title: 'roadtrip: when the private-place snap moves a post''s checkpoint_id to a fuzzed checkpoint on
    another leg, the post''s leg_id is not re-derived (timeline can read "leg 2 · Cloudcroft, NM")'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: tools
  character_slug: krispy
  tags:
  - roadtrip
  - atx-sjc
  - pin
  - privacy
  - fuzz
  - leg
  - spring-2026-09
  status: design
  description: 'Since roadtrip 0eceea3 (Fly v10) a raw browser/EXIF pin at a private place is snapped
    to its fuzzed checkpoint and the post''s checkpoint_id is set to that checkpoint so the popup can
    say "near <checkpoint>". The post''s leg_id is left as chosen on the form. On the morning of Sep 5
    a post from the Cloudcroft driveway with leg 2 selected therefore keeps leg_id=leg 2 while checkpoint_id=checkpoint
    3 (leg 1''s terminus): the map pin and popup are right, but the timeline line "leg 2 · Cloudcroft,
    NM" mixes legs, and the leg-2 page lists a post whose checkpoint is on leg 1. Low stakes, cosmetic;
    nothing enforces leg_id == checkpoint.leg_id anywhere in the store.'
  dont: Don't fix it by refusing the snap — privacy beats the leg label. Don't re-derive leg_id in the
    boot sweep either; the sweep is already recorded under meta key pins_fuzzed_near_private_v1 and must
    not re-run.
  do_this: In handlers.go postCreate, after nearPrivate returns a checkpoint, either set post.LegID =
    pc.LegID (the checkpoint is the more specific fact, as the form's checkpoint pick already does) or
    leave leg_id alone and drop the checkpoint name from the timeline line when its leg differs. Pick
    one, verify on the Docker copy with leg 2 + a pin at 32.957,-105.742, and note it in README under
    "Where a pin comes from".
