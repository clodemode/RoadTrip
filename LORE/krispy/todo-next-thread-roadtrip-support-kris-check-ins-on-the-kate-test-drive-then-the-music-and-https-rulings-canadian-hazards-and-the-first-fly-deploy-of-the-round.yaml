  title: 'TODO-NEXT, roadtrip (start on Opus, thin tokens): support Kris''s phone check-ins on the KATE''s
    Kingston→Toronto test drive and fix what he hits, then the music and HTTPS rulings, the Canadian hazards
    and chip budget, the sim fall-backs, and the first Fly deploy of the round when Kris says'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - next-thread
  - driver
  - kate
  - checkin
  status: design
  description: |-
    agent_start(app_scope='roadtrip', lair='all', tag='driver'). Read the truth stone truth-roadtrip-2026-11-07-driver-aids-round-on-a-local-kate-melt-sink-server-held-sim-eta-policy-post-a-photo-shipped-prs-22-to-27 for what shipped and the KATE recipe; the spec row holds the design and Kris's rulings in its do_also.
    STATE at 2026-11-07 ~15:50 EST (20:50 UTC): clodemode/RoadTrip trunk 3f4f054 (PRs 22-27 merged by Kris); Fly v41 is still ba595e8, NOTHING of this round is deployed. roadtrip-kate runs an image built from PR 27's branch (same content as trunk) on :8089 with SIM_ALLOWED=1 and MELT to redis:6379; active ride kgn-yyz-test (test trip on the volume, stops Kingston, Napanee, Belleville, Trenton, Cobourg, Oshawa, Toronto), a sim drive for user kris started 15:46 EST at x3 (restart the container and it is gone; the test trip file stays). Kris was about to post check-in photos from his phone at Napanee and Belleville (Post a Photo, Milestone radio). All worktrees and merged branches are removed; the LORE commit for this round is a PR the parent opened at thread end (check it merged: git -C roadtrip status should be clean after fetch + ff).
    NEXT, in order: (1) whatever Kris hits checking in on the KATE: rebuild the KATE from the fix branch (docker build -q -t roadtrip:kate-<x> . in the worktree; docker rm -f roadtrip-kate; the docker run line is in the truth stone), one PR per fix, Gherkin first on the godog harness (features/, features_test.go). (2) Ask Kris to rule, as questions with pro/con: music on /driver (mini-player playing MusicOrgan's stream URLs vs keep the RoadTracks link-out; the parent recommended link-out for the trip); HTTPS for real GPS on the KATE via Tailscale serve (installed, stopped) vs stay on LAN HTTP with the sim; the RoadTracks token for the KATE (he pastes ROADTRACKS_TOKEN into roadtrip/data/kate.env, then docker restart roadtrip-kate). ETA rounding was taken as 5 minutes without a ruling; confirm. (3) todo-roadtrip-hazard-chips-read-unknown-error-on-a-canadian-route-the-weather-source-is-us-only-and-traffic-failed-on-the-401-leg (departure 2026-11-10 starts in Ontario). (4) todo-roadtrip-driver-screen-traffic-chips-need-a-budget-the-day-1-leg-rendered-150-closure-chips-and-146-more. (5) todo-roadtrip-chester-send-my-position-and-the-post-form-phone-pin-still-ask-the-browser-fall-back-to-the-server-held-sim-position-and-drop-the-dead-arrive-strip-css. (6) todo-roadtrip-melt-on-fly-needs-a-file-sink-like-fintracks-melt-sink-py-since-the-machine-has-no-redis before the deploy, or accept MELT-off on prod for this trip. (7) The first Fly deploy of the round, only on Kris's word: gh workflow run deploy.yml --ref trunk -f mode=plan, then apply; SIM_ALLOWED stays unset on Fly. (8) The DriveTrack close ruling is still open: todo-roadtrip-drivetrack-soundtrack-from-musicorgan-shared-key-so-chester-can-pick-live-and-planned-driving-music proposed superseded by RoadTracks PR 11 + the Chester RoadTracks tool row.
    BUILDERS: Sonnet, brief names files and line ranges, one RED/GREEN cycle plus a RED control, report ≤ 25 lines; the godog Docker recipe (mount the main .git read-only and set safe.directory) is in the PR 26/27 bodies. Kris merges; hand him one PR at a time; stacked PRs open on their stack parent.
