entries:
- slug: spec-roadtrip-chester-enroute-reroute-proposes-a-planned-route-choice-the-trip-keeper-taps-to-save-and-route-me-here-sets-the-freelance-destination
  title: 'roadtrip CHESTER reroute (Kris 2026-11-08): enroute, Chester proposes a switch among the trip''s
    planned route choices as a card the trip-keeper taps to save through the existing plan save, and a
    place card''s Route me here sets the FreeLance destination for a same-day detour without touching
    the plan'
  domain: lore
  lore_type: spec
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - chester
  - reroute
  - plan
  - freelance
  - driver
  status: design
  description: |-
    Kris, 2026-11-08. Written as if public: no place, travel date or person. RULED scope: planned-choice switch plus Route me here; a full replan (new stops, nights or legs) is out of scope before departure.

    TODAY. Chester is told the selected plan only, not the alternatives, and has two tools that change nothing (show_places, and the music cards). The plan changes only through POST /driver/plan (planSave, Store.ApplyPlan), whose planConflicts guard refuses a change reaching a leg with posts or an arrived checkpoint.

    A. WHAT CHESTER IS TOLD. chesterContext adds each plan option with its choices, which is selected, the miles and hours each choice would change (the figures GET /plan.json?opt- already computes), and whether planConflicts would refuse it. chesterPromptVersion changes with it.

    B. PROPOSE A SWITCH. A new tool takes option id, choice id and a one-sentence why. The server checks it against the loaded plan and drops anything invalid. It renders in the answer as a card: the option, the choice, the change in miles and hours, the why, and a Save button. Save posts the full current selection with that one change through the plan save, and the card shows Saved or Not saved with the reason, in place.

    C. ROUTE ME HERE. A place card gains a Route me here button, signed in only. It resolves the place through the search FreeLance already uses and sets the destination through POST /driver/freelance/dest. The plan does not change. The driver screen says a detour is in force and offers a way back to the plan.

    D. THE SAME-DAY LIMIT. A leg that already holds posts cannot be switched. Chester must say so and offer Route me here instead of proposing a switch the guard will refuse.

    E. THE LOG. A proposal, and whether it was saved or refused, is recorded on the question's log row.
  dont: 'DONT change the plan without the trip-keeper''s tap: Chester proposes, the operator rules. DONT
    add a path that re-plans around Store.ApplyPlan or weakens planConflicts. DONT call the real API in
    a test. DONT open a modal. DONT render or send a coordinate that did not come out of the store or
    publishPosition, and DONT send the private overlay. DONT present a drive time as live traffic. DONT
    write a Route me here destination into the plan. DONT build new stops, nights or legs here.'
  do_this: 'Gherkin first on godog in features/chester_reroute.feature with the API stubbed at apiStub,
    plus a RED control. Scenarios: a proposed switch renders with its miles and hours; an invalid proposal
    is dropped; Save applies through the plan save; a refused save says why and changes nothing; Chester
    is told a choice is locked; Route me here sets the destination and leaves the plan unchanged; the
    proposal is logged. Check that a question using search, a proposal and an answer fits inside chesterRounds.
    On the KATE, the test ride has no options, so verify on a synthetic trip with options, never a trip
    document in the repo.'
  do_also: 'PLANNING REVIEW 2026-11-08 (Fable, codi-roadtrip-reroute-plan-2026-11-08), its key code claims
    checked against the source the same day. BUILD ORDER: Route me here; then the proposal context, tool,
    card and log; then Save with its outcome on the log row. If Save slips, the card links to the plan
    page with the choice pre-selected and the existing Save there meets the ruling. MISSING CASE ADDED:
    planConflicts locks only legs with posts or arrived or skipped checkpoints, so today''s leg being
    driven with no post yet is switchable and a saved switch would replace the road under the car. The
    route-choices block marks today''s leg IN PROGRESS once the drive has started, Chester does not propose
    switching a leg in progress unless asked outright, and the card for one says so. A read-only Store.PlanConflictsFor
    (Begin, planConflicts, Rollback) supplies the LOCKED marks; ApplyPlan and planConflicts are unchanged.
    The tool is offered only when the trip has options. Figures say plan estimate, not traffic. Route
    me here sends name and town to the existing destination search; a restart forgets the detour, and
    the driver screen says so.'
