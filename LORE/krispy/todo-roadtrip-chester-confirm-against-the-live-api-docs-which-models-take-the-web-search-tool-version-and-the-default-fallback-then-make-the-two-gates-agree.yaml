entries:
- slug: todo-roadtrip-chester-confirm-against-the-live-api-docs-which-models-take-the-web-search-tool-version-and-the-default-fallback-then-make-the-two-gates-agree
  title: 'roadtrip: Chester''s model allow-list and its fallback opt-in were written from the bundled
    API notes, which disagree with each other; confirm both against the live docs, then make the two gates
    agree so no allowed model can fail every question'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: logic
  character_slug: krispy
  tags:
  - chester
  - claude-api
  - models
  - fallback
  - 2026-11
  status: design
  description: 'Found while fixing the Chester review items, 2026-11-06. Two things were taken from the
    bundled API reference and not checked against the live documentation. (1) The allow-list for the web
    search tool version in use (web_search_20260209) holds the Opus and Sonnet models only. One page of
    the reference also names the first Fable model for that tool version and another page does not; the
    newest Fable is named on neither. So a Fable model is refused at boot today, which may be stricter
    than the API is. (2) Chester sends the default fallback opt-in (fallbacks set to default, with its
    beta header) on every question whenever CHESTER_FALLBACK is default, whatever the model. The reference
    names that opt-in for four models; the allow-list permits five more (three older Opus models and two
    older Sonnet models) for which it is not documented. If the API rejects the parameter on one of those,
    that model boots cleanly and then fails every question with a 400, which is the same class of fault
    the allow-list was added to prevent. Nothing here was reproduced: no live call was made.'
  dont: 'DONT widen the allow-list from memory or from one page of notes. DONT make a live API call from
    a test or from an agent: read the published documentation, or let the operator ask one question per
    model with their own key.'
  do_this: 'Read the live documentation for the web search tool versions and for server-side fallbacks.
    Set chesterSearchModels to exactly the documented models for the tool version sent. Add a second boot
    check: when CHESTER_FALLBACK is default and a mode''s model is not one the default fallback is documented
    for, either send that mode without the opt-in or leave Chester off with a plain log line. Extend TestChesterModelMustSuitTheSearchTool
    to cover both.'
  effort: S
  impact: medium
  triaged_at: '2026-11-06T21:52:52.109481+00:00'
  triaged_by: krispy
