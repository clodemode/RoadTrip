  status: design
  description: |-
    Thread RT:Kingston to Hudson Bend trip (harness 1feba0cc), 2026-11-06 19:15 to about 22:45 UTC. Written as if public.

    SHIPPED. clodemode/RoadTrip PR 1, merge 19b27b9, deployed 21:33 UTC: trip files on the volume pushed by token, the active ride as stored data, day-level route options with a guarded saved selection, the planner page, a public checklist with signed-in-only private text, a route converter, /app paths and APP_PROFILE.yaml, per-ride private overlay, leg lines masked near private places, repo guards. PR 2, merge 16df6f3, deployed 22:29 UTC: Chester (signed-in only, a daily dollar cap, web search, place cards, a verdict log), an origin check on signed-in writes, the .env standard, Go 1.25. Suite 58 to 173 tests. The trip and its checklist were pushed to the live volume and the trip made active.

    HOW. Six builder CODIs and two cold reviewers, each with a contract in its prompt, RED controls, and a local container left for the orchestrator's own browser check. Every push went once, after the suite ran by hand in Docker.

    MEASURED. Review found nothing that moves an arrived checkpoint, a post or a photo and no private leak; it did find a stored-XSS path through a map tooltip, free text printable on public pages through a query string, and two ways the spend cap under-counted. The first live question found what no stub could: on the model in use, text written before a tool call is not returned as text, so answers came back as cards with no words; and usage steps with no model name were priced as the dearest model, overstating cost 2.5 times. Live cost on the default model: about 8 to 9 cents for a quick question that searches, 1 to 4 cents without; 15 to 19 s with a search, 5 to 10 s without; through Fly the first words arrived at 2.9 s.

    RULED by Kris: the site stays public during the trip; the checklist names no person; one download (a vendored stylesheet) approved; builders come off the most expensive model.

    NOT DONE. The restyle (spec filed, handed on). Filed todos: a past-trips index, per-ride visibility, private overlay entries that move when a route choice adds a stop, a pre-push gate, Chester's first-word latency after cards, sources on answers, the search-tool model list. Unverified: a real phone, a real photo on the new ride, plan mode live, Chester's dollars against the account's own report.
  dont: 'DONT read this stone as the state of the site: it is the state at thread end. DONT assume a stub
    proves an API request: the two defects that mattered appeared only on the first live call.'
  do_this: 'Successor: todo-next-thread-roadtrip-design-system-restyle-build-the-spec-on-a-branch-from-trunk-with-the-staged-bootstrap-and-the-api-stand-in.'
