entries:
- slug: spec-roadtrip-drive-tracks-tap-asks-chester-for-one-album-that-fits-the-moment-and-lands-on-its-album-page
  title: 'roadtrip Drive Tracks (RULED by Kris 2026-11-08): one tap asks Chester for one album from the
    library that fits where the car is, what the drive is doing and the last thing typed to Chester, and
    lands on that album''s page; music still never starts by itself'
  domain: lore
  lore_type: spec
  app_scope: roadtrip
  lair: all
  character_slug: krispy
  tags:
  - chester
  - music
  - drive-tracks
  - driver
  status: design
  description: |-
    Kris, 2026-11-08, after tapping Drive Tracks on the KATE: it should play an album matching the theme, not just open the player. Written as if public. RULED: straight to the album. This replaces the plain jump in features/drive_tracks_button.feature when Chester is on.

    BEHAVIOUR. The button opens a signed-in RoadTrip page in a new tab that says Chester is picking, asks Chester once, shows the album it picked while the answer finishes, then replaces itself with that album's page, whose Play button is one more tap. With Chester off, over its daily limit, busy, or with no album found, the tab opens the player as the button does today.

    THE THEME. Chester's usual context already carries the place, the day and the leg. The question adds the last thing typed to Chester on this ride in the past two hours, when there is one, which leads the theme; otherwise the place and the drive lead. Albums already picked by Drive Tracks today are named so a second tap gives something different.

    COST AND LOG. Each tap is one quick-mode Chester question, logged with its cost and held to the daily limit. The library matches artist and album names only, so Chester chooses artists that suit the theme and searches them; whether that gives good picks is unproven until a live tap.
  dont: 'DONT start audio or send audio through RoadTrip. DONT add a mini-player. DONT navigate before
    the done event: leaving early can cancel the question before its log row is written. DONT follow a
    link that is not http or https. DONT send the private overlay or a raw coordinate. DONT call the real
    API in a test. DONT show the Drive Tracks question as a preset button on the Chester page.'
  do_this: 'Gherkin first in features/drive_tracks_button.feature with the API stubbed at apiStub, plus
    a RED control. Prove: with Chester on the button goes to the picking page; the question carries the
    last typed question when recent and not when old; the album''s link is what the page goes to; each
    fallback reaches the player; a tap is logged.'
  do_also: 'CHANGED BY KRIS 2026-11-08, same evening: Drive Tracks should play inside RoadTrip on the
    RoadTracks card and not move to the music player site. This overrides the earlier no-mini-player ruling
    and this row''s landing on the album page. The Chester pick and the theme above still stand. No code
    was built from this row; the in-page design is pending.'
  effort: M
  impact: high
