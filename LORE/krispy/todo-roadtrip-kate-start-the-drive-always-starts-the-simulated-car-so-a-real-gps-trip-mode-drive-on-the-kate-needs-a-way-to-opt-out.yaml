entries:
- slug: todo-roadtrip-kate-start-the-drive-always-starts-the-simulated-car-so-a-real-gps-trip-mode-drive-on-the-kate-needs-a-way-to-opt-out
  title: 'roadtrip KATE: Start the drive always starts the simulated car when SIM_ALLOWED is set, and
    the car then overrides real GPS on every post, so a real-GPS Trip-mode drive on the KATE over Tailscale
    needs a way to opt out'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: logic
  character_slug: krispy
  tags:
  - kate
  - sim
  - driver
  - checkin
  status: design
  description: 'handlers.go postCreate: case a.simAllowed starts the stepping car whatever the phone reports,
    and resolvePin puts the sim ahead of every source. Kris wants the KATE as the fast loop over Tailscale.
    Aimless and Destined are not affected since PR 43. Options to rule: a choice at Start, a KATE env
    setting, or a real position within 10 km of the start winning over the sim (which would break stepping
    tests started from home near Kingston).'
  effort: S
  impact: medium
  triaged_at: '2026-11-08T20:23:05.458161+00:00'
  triaged_by: krispy
