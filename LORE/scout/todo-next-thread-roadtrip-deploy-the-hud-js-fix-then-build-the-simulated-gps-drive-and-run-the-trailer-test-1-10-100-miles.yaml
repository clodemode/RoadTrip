  title: 'TODO-NEXT, roadtrip: deploy trunk e3076ef (PR 14 hud.js syntax fix; ALL /driver JS is dead live
    on v37), then build the ?sim= fake-GPS drive and run the Trailer Test from the desk: 1 mile, 10 miles,
    100 miles'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: surface
  character_slug: scout
  tags:
  - next-thread
  - driver
  - roadtracks
  - trailer-test
