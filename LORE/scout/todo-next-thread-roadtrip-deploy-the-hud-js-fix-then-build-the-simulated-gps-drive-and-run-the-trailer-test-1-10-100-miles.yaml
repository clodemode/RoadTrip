  status: shipped
  description: |-
    Open with agent_start(session=<harness id>, app_scope='roadtrip', tag='driver'). Filed 2026-11-07 15:25 UTC by thread RT:roadtracks sound (local_df301e17-815b-41f2-9810-0adc3e4af245) at Kris's word, handing open work to the RT sibling.

    STATE (verified 15:24 UTC): roadtrip-clodemode LIVE = v37, image from trunk 2ab4ed6, deployed by a sibling with a direct flyctl deploy. On v37 static/js/hud.js:125 (from PR 9, 95c48a8) has an unescaped apostrophe ("Chester's") inside a single-quoted string: SyntaxError, so ALL /driver JS is dead (weather/traffic chips stuck on 'checking', RoadTracks and drive-mode forms reload the page). FIXED on trunk by PR 14 (merged, trunk e3076ef, also PR 12 lore): typographic apostrophe, RoadTracks reserves a fixed 14rem scrolling result box + status line (Kris: no jumpy pages / layout shift), and node --check on static/js now gates ci.yml AND deploy.yml. A Deploy workflow run (42385827760, apply, e3076ef) was CANCELLED in the go-test gate at Kris's word ('one more thread on RT before deploy'): nothing released.

    RoadTracks is LIVE end to end: musicorgan v80 (trunk 1b059c4, PR 74) serves GET /api/roadtracks/search behind MO_ROADTRACKS_TOKEN (no/wrong key -> 401); RoadTrip /driver/roadtracks/search (PR 11) returned 200 with real albums for 'neil young' from the signed-in built-in browser, links https://music.opeongo.net/album/<id>/. Keys are Fly secrets on both apps (same value, generated once, never stored elsewhere).

    SIM DRIVE (Kris's ask, not built): a builder CODI was stopped mid-flight; its worktree /Users/kris/projects/CLODE/roadtrip/.wt/driver-sim-drive (branch krispy/driver-sim-drive at e3076ef, NOT pushed) holds only an uncommitted static/js/sim_test.mjs. Design: static/js/sim.js loaded before hud.js on /driver, inert unless ?sim=1|10|100; params from=lat,lng (default first real fix), to=lat,lng (default the HUD next stop), x= compression (1/10/60), mph=60; it replaces navigator.geolocation watchPosition/getCurrentPosition/clearWatch with a fake walking the great-circle line one fix per real second, stops at the rung distance; a fixed SIMULATED GPS banner that reserves its space and a Stop link; nothing stored server side; at most one HUD fetch per ~5 s. Tests: node --check, node --test pure math test RED first with a RED control, a Go assertion that /driver loads sim.js before hud.js. PR body gives Kris three click URLs (Austin from=30.2672,-97.7431 to=30.3890,-97.9480 for 1 and 10 mi; 100 mi toward San Antonio 29.4241,-98.4936).

    ORDER: 1) deploy e3076ef through the Deploy workflow (gh workflow run deploy.yml --ref trunk -f mode=apply), never a direct flyctl deploy (that skips the gates); confirm in the built-in browser (Kris is signed in there) that the console is clean, chips resolve and a RoadTracks search fills the box without moving the page. 2) build the sim drive (builder on a cheaper model). 3) Trailer Test: rung 1 mile, read the real screen; then 10; then 100; report what the screen shows at each rung.

    Picked-up: 2026-11-07, 70acc5b3-b7de-4927-9090-e6ea89962d13: consumed at pickup by lore_pickup; the picking thread now carries this work
  dont: 'DONT flyctl deploy roadtrip directly: it skips the gates (that is how the hud.js SyntaxError
    reached v37). DONT climb a rung before reading the real screen at the one below. DONT store simulated
    positions server side. DONT read or print the RoadTracks key; a production key read was refused by
    the permission classifier on 2026-11-07.'
  do_this: Deploy e3076ef via the Deploy workflow and verify /driver in the browser; then build ?sim=
    fake GPS (sim.js) and run the Trailer Test 1, 10, 100 miles from the desk.
