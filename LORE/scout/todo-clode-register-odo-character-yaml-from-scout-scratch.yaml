entries:
- slug: todo-clode-register-odo-character-yaml-from-scout-scratch
  title: Register Odo (roadtrip's nine-banded armadillo) in the character registry — drop the staged odo.yaml into ABOUT/CLODE/LORE/CHARACTERS/ and character_yaml_sync(apply=True)
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: surface
  character_slug: scout
  tags:
  - roadtrip
  - atx-sjc
  - character
  - phonomeme
  - odo
  - registry
  - spring-2026-09
  status: shipped
  description: 'The SCOUT CODI atx-sjc-odo-mint-scout (2026-09-01) minted Odo — slug odo, name Odo, role mile-counter, tagline "Odo counts every mile.", rarity Rare, color_primary #c9784b, color_theme stone, card_icon 🐾 (Unicode has no armadillo emoji; the paw print is the armadillo-adjacent choice, noted per the brief), sort_order 25, is_active true, skills Mile Counting / Legs and Checkpoints / Arrival Stamps / Live from the Road / Time Zones / Open GeoJSON. character_yaml_sync reads ONLY ABOUT/CLODE/LORE/CHARACTERS/*.yaml, and that directory was outside the CODI''s write paths (creature.svg, README.md, two main.go constants), so the registration was NOT performed. The finished YAML is staged, ready to copy verbatim, at /private/tmp/claude-502/-Users-kris-projects-CLODE/df14a661-ffba-47a2-9a49-814ca919423b/scratchpad/odo/odo.yaml (session scratchpad — copy it before that session''s scratch is reaped; the payload is also reproduced in do_this). Sibling SVGs in the same directory: creature.svg (64x64, ids band-1..band-9 head→tail, leg-front, leg-back, tail, snout, ear, eye, nose, shell, belly, road) and odo-og.svg (1200x630 social preview, not wired in).'
  dont: Don't hand-insert the fools_character row via SQL or lairs tools — the YAML file is the canonical home (README.yaml in CHARACTERS/); every registry row must have its YAML. Don't pick 🦔 (hedgehog) — wrong animal.
  do_this: 'cp <scratch>/odo/odo.yaml ABOUT/CLODE/LORE/CHARACTERS/odo.yaml, then character_yaml_sync() dry-run → expect created:[odo] → character_yaml_sync(apply=True) → character_registry_show shows odo. Commit the YAML in ABOUT (pathspec commit, shared tree). YAML payload if the scratch is gone — character: {slug: odo, name: Odo, role: mile-counter, tagline: "Odo counts every mile.", description: "A nine-banded armadillo, the great slow land migrator that walked out of Texas and kept going, armoured like a car. Odo is the creature of the roadtrip app: his banded shell reads as a segmented odometer, and he counts every mile of a one-way ride — the planned legs, the checkpoints stamped as the car arrives, the posts and photos from the road. Phonomeme: Odo = odo(meter); the sound carries the function. Minted 2026-09-01 for the Austin → San Jose ride (2026-09-04..07).", color_primary: ''#c9784b'', color_theme: stone, character_animated: '''', character_icon: '''', card_icon: "\U0001F43E", rarity: Rare, skills: [Mile Counting, Legs and Checkpoints, Arrival Stamps, Live from the Road, Time Zones, Open GeoJSON], sort_order: 25, container_archetype: false, container_archetype_notes: "Guardian of roadtrip (CLODE/roadtrip/, live at roadtrip-clodemode.fly.dev). Not a fleet container: a standalone Go static binary + SQLite on Fly, outside the ABOUT compose, per the EagleLakeRocks pattern. card_icon is the paw print because Unicode has no armadillo emoji.", is_active: true}. Check sort_order 25 is still free (perch holds 24).'
  do_also: If Kris prefers a different icon over 🐾, change card_icon in the YAML before syncing; the SVG and constants do not depend on it. Consider copying creature.svg to CHARACTERS/odo.svg the way perch.svg sits beside perch.yaml.
