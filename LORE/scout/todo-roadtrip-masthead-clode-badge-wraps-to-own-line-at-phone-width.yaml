entries:
- slug: todo-roadtrip-masthead-clode-badge-wraps-to-own-line-at-phone-width
  title: 'roadtrip masthead: the "Built with CLODE" badge wraps onto its own line at 375 px — tuck it
    into the nav row or shrink it on phones'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: surface
  character_slug: scout
  tags:
  - roadtrip
  - atx-sjc
  - masthead
  - mobile
  - scout
  status: design
  description: 'Seen 2026-09-01 on the Browser pane at 375×812 (release v6): the masthead stacks Odo +
    wordmark, then the nav row (Ride Photos GeoJSON Sign in), then the CLODE badge alone on a third line,
    so the masthead eats ~340 px of the first viewport before the hero. Pre-existing per the CINDERS terrain
    CODI, inherited from the EagleLakeRocks masthead. Fix in roadtrip/static/css/app.css only: at ≤480
    px make .clode-badge a compact inline chip on the nav row (kicker hidden, "CLODE" only) or move it
    to the footer on phones. Cosmetic; do after the pin-fallback and GONZO passes so it does not race
    a deploy.'
