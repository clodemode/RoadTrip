entries:
- slug: todo-roadtrip-seed-data-items-before-departure-lodging-pins-geocode-tioga
  title: 'atx-sjc seed: resolve the open data items before 2026-09-04 — Cloudcroft street geocode (address now lives in $DATA_DIR/private.json, admin-only), Flagstaff + Mammoth lodging pins, San Jose address, 2026 Tioga/Yosemite entry rules'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: content
  character_slug: scout
  tags:
  - roadtrip
  - atx-sjc
  - seed
  - data
  status: shipped
  description: 'The seed shipped in roadtrip/seed/atx-sjc-2026-09.geojson is planning-grade and public-only. Origin is ''Hudson Bend (home)'' fuzzed; checkpoint 3 is ''Cloudcroft, NM'' / ''Night 1 — before dark'' / fuzzed (ruled 2026-09-01: the street address is in $DATA_DIR/private.json on the volume, rendered only in the admin post form — EagleLakeRocks dedications pattern; never in the repo). Still open per the spec''s do_this: Cloudcroft street-level geocode (the pin is the village centroid; a fuzzed point snaps anyway, so this only matters for the private overlay / the driver''s own nav); checkpoints 4 and 5 are ''Flagstaff, AZ (near)'' / ''Mammoth Lakes, CA (near)'' placeholders until lodging is confirmed; checkpoint 6 ''San Jose, CA'' has no address; leg 4 caveat says check the 2026 Yosemite/Tioga entry-reservation rules (alt CA-108 Sonora Pass). Planning data is now SEED-OWNED UNTIL ACTUALIZED: a seed edit + flyctl deploy refreshes legs, any checkpoint not yet stamped arrived, and the candidate sights on boot — no volume rebuild needed. Any new private address goes into private.json (keyed by checkpoint ord), pushed to the volume by sftp, never into the seed.'
  do_this: Kris supplies the data items; CODI edits the seed (public names/labels/pins only), adds any address to private.json on the volume, flyctl deploy -a roadtrip-clodemode, verifies /route.geojson and the boot log's 'planning refreshed' line.
  do_also: "2026-09-02 00:30Z: Tioga item RESOLVED by web lookup — Yosemite entrance reservations are NOT required in 2026 (NPS paused the system; Tioga Pass CA-120 open in September; pay the entrance fee or show the interagency pass; Valley lots fill by 07:30 on weekends). Sources: yosemite.org/yosemite-entrance-reservations-not-required-2026/ and nps.gov/yose/planyourvisit/permitsandreservations.htm. The leg-4 caveat in seed/atx-sjc-2026-09.geojson is being rewritten to say so by codi-roadtrip-custom-host-2026-09-02 (same deploy as the roadtrip.opeongo.net canonical-host redirect). 2026-09-06 (web run, trunk 290b307, v17): night 2 was ASH FORK AZ, not Flagstaff — checkpoint 4 and legs 2/3 corrected in the seed. 2026-09-07 PLANNED, not yet shipped: night 3 was BRIDGEPORT CA (The Bodie Hotel, Bunk Room), not Mammoth — checkpoint 5 and legs 3/4 still name Mammoth; the overlay still carries only checkpoint 3 and without \"Loop\"/the host note; the Data workflow has never run (no PRIVATE_JSON / ADMIN_PASSWORD secrets). All of it is Phase A4 + Phase C of spec-roadtrip-made-it-to-route-lock-push-token-and-lodging-actuals-cloud-run-2026-09-07, which also adds the PUSH_TOKEN bearer so the overlay is pushed by curl instead of a password sign-in. STILL OPEN after that: the San Jose address (checkpoint 6), Cloudcroft street geocode (cosmetic)."
