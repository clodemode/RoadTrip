  description: |-
    HANDOFF from thread RT:Kingston to Hudson Bend trip (harness 1feba0cc, 2026-11-06). Kris asked for the Design System on roadtrip; the build was dispatched and stopped minutes later, before it wrote anything, when Kris called a landing for the night and ruled that builders come off the most expensive model. He then asked for a sibling thread on Opus to finish it.

    STATE at 2026-11-06 22:30 UTC. Trunk is 16df6f3 (PR 1: trip files on the volume, route options, planner, checklist; PR 2: the Chester helper), deployed. The contract is spec-roadtrip-adopts-the-design-system-bootstrap-light-one-theme-a-vendored-foundation-folded-on-purpose-phone-first-and-no-dialogs-with-roadtrips-own-brand-kept (sections A to H); its YAML reaches trunk with the thread-end LORE pull request. No restyle code exists.

    STAGED for the build, both under the gitignored data dir of the roadtrip checkout: data/vendor-staging/bootstrap-5.3.3/bootstrap.min.css (232,803 bytes, v5.3.3, sha384 QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH, matching Bootstrap's published integrity; the one download Kris approved, so download nothing else), and data/chester-stub/stub.py (a local stand-in for the Claude API, so the helper's pages render with a dummy key and no spend).

    KNOWN before starting: the stylesheet carries a dark colour-scheme block; templates still use confirm() for delete; the masthead clips or breaks a word at phone width with the signed-in links; the signed-in link set is Ride, Plan, Checklist, Photos, GeoJSON, Post, Chester, Lodging, Sign out. The suite is 173 tests under golang:1.25 in Docker (the host has no Go toolchain). The repo has no pre-push gate (todo-roadtrip-has-no-pre-push-gate-so-push-sh-pushes-with-no-verdict-and-records-no-push-board-row), so run the suite by hand before the one push.

    Picked-up: 2026-11-06, 30a6d1fa-b557-41b0-bc77-2ebd9afd4446: consumed at pickup by lore_pickup; the picking thread now carries this work
  dont: 'DONT dispatch a builder on the most expensive model: Kris ruled 2026-11-06 that builders come
    off it. DONT download anything further. DONT make a live API call or read the local secrets file.
    DONT change a route, field name or JSON shape: markup and style only.'
  do_this: Pick up with /todo and this slug. Cut a locked worktree of roadtrip from trunk, build the spec
    with tests and the style-audit tests it names, check every page in a browser at 390px and at desktop
    width, push once, open one pull request against trunk for Kris to merge.
