  status: canonical
  description: |-
    LANCE_GUIDE roadmap for the Road-Trip Narrative SPRING (Spring 2026). This SPEC sequences the work that takes the `ride` Django app from "quietly-a-road-trip-app" to "loudly, documented, end-to-end road-trip narrative format with the Hudson Bend → Fredericksburg trip live on staging as proof".

    The SPRING was triggered by building the photo-drop ceremony (bloodride_photo_add MCP tool + bloodride-photo-drop skill, 2026-05-12) and returning from a Fredericksburg, TX road trip (2026-05-14) with highlights/recommendations/photos/RWGPS map ready to ingest.

    MARK_STONES (sequenced):

    A — CHARTER LANDED (this SPEC + the 6 child SPECs). DONE on filing. Future-state Ride concepts now have a documented home. CODI dispatch can `ido_briefing(app_scope='bloodride')` and reach the road-trip charter as a first-class section.

    B — INAUGURAL TRIP INGEST (fredberg-2026-05). Ingest Hudson Bend → Fredericksburg trip artifacts: highlights, key locations as Sights / Meals / Lodging, recommendations as Recommendation rows, photos via photo_drop ceremony. Owner character: scout (data + surface), dispatched from main. Depends on: spec-ride-app-role-and-scope, spec-ride-photo-anchor-contract, spec-ride-narrative-stitch-pattern, spec-ride-roadtrip-output-deliverables.

    C — RWGPS IMPORT MGMT CMD. Build `python manage.py import_rwgps` per spec. Owner character: krispy (tools). Depends on: spec-ride-rwgps-import-contract. Unblocks: importing the Fredericksburg ride's planned route alongside the actual photo-anchored timeline.

    D — CHAT-IMAGE BRIDGE IMPL. Build bloodride_inbox_peek MCP tool + update bloodride-photo-drop skill to use the drop-zone. Owner character: told (tools/live-blog plumbing). Depends on: spec-bloodride-photo-drop-chat-image-bridge. Unblocks: in-chat live-blogging via AirDrop → bloodride-inbox/ → skill picks newest.

    E — FULL TRIP RE-RENDER. After B/C/D land, re-render fredberg-2026-05 with full enrichment: route from RWGPS, photos via the drop-zone, recommendations promoted, mishap log if any, map overlay complete. Truth-stone runs (per truth-bloodride-photo-drop-staging-publishes). Owner character: scout (surface). Depends on: B, C, D.

    CODI DISPATCH CONVENTION (per spec-blance-armstrong-spring pattern): CODI-first for every MARK_STONE; SCOUT for surface/data, KRISPY for tools, TOLD for live-blog plumbing, LANCE for cross-cutting sequencing. Each MARK_STONE lands as a separate lore_type=todo entry that depends_on the relevant SPEC(s) and this roadmap. Each TODO is closed-out (archived per feedback_todo_purge_on_done) on completion.
  dont: Don't dispatch a single CODI to "do the whole roadmap" — each MARK_STONE has different character
    ownership and different SPEC dependencies; bundle by file-scope per feedback_bundled_parallel_codi_dispatch.
    Don't re-open closed MARK_STONEs to add scope creep — file a new TODO that depends on the same SPEC.
    Don't skip the TRUTH_STONE run in MARK_STONE E — it's the proof the deliverables match the SPEC.
  do_this: 'For each MARK_STONE B-E, file a lore_type=todo entry with depends_on_add pointing at the relevant
    SPEC(s) and this roadmap. Sequence: B (data ingest, no new code) can run in parallel with C (mgmt
    cmd) and D (tools). E gates on all three. Use /todo to surface the next pick. Use ido_briefing(app_scope=''bloodride'')
    to get CODI dispatch context.'
  do_also: After SPRING completion (all MARK_STONEs done), the road-trip charter is the documented baseline.
    Future trips (Big Bend, Marfa, whatever's next) follow the same ingest pattern — they're new Ride
    rows, not new Django apps. Future SPRINGs evolve the charter via additional spec-ride-* entries.
  depends_on:
  - spec-bloodride-photo-drop-chat-image-bridge
  - spec-ride-app-role-and-scope
  - spec-ride-narrative-stitch-pattern
  - spec-ride-photo-anchor-contract
  - spec-ride-roadtrip-output-deliverables
  - spec-ride-rwgps-import-contract
