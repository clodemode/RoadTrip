  status: shipped
  description: 'Kris 2026-09-01: "get odo onto our website and this is a southwest theme as the backgrounds can match the terrain we are traveling in" and "after scout mints the SVG for odo, we can use CINDERS to curate the visuals and gonzo for building an animation recipe". Input: SCOUT''s creature.svg + odo-og.svg (paths in the atx-sjc-odo-mint-scout ledger report). Part A — clodemode.com: Odo joins the characters the LANCE way: ABOUT/PRODUCE_LUNCH/public/images/odo.svg, og/odo.svg+png, a public/odo/ hero page (one viewport, feedback_teaser_leanings: 100dvh, clamp(), full badge SVG never hand-trimmed, dark text), the characters gallery entry, then teaser_bake + teaser_publish to the clodemode Fly app and validate_teaser/social_preview_check. Part B — roadtrip app: per-leg terrain palette + a lightweight inline-SVG horizon band per leg (no photos, no gradients heavier than two stops, under 4 KB each): leg 1 Hill Country limestone and live oak → West Texas plains and mesa → Sacramento Mountains pine at Cloudcroft; leg 2 White Sands gypsum → high desert → Painted Desert reds → Flagstaff ponderosa; leg 3 Mojave creosote and Hoover Dam basalt → Eastern Sierra granite; leg 4 Mono Lake tufa → Tioga alpine → Central Valley gold → Bay. Hero background follows the current leg (day-of-trip), /legs/<slug> uses its own; CSS variables per leg in app.css; masthead disc colour follows. Contrast per teaser leanings; phone-first. Deploy roadtrip-clodemode after; verify live.'
  do_this: One CINDERS CODI after todo-bloodride-atx-sjc-mint-roadtrip-creature-phonomeme-and-masthead-dress ships; Part A and Part B touch different repos and may be two file-scoped CODIs in parallel. Never touch roadtrip/ while the SCOUT or GONZO beacon is live on it. codi_ledger_record on completion.
  depends_on:
  - spec-bloodride-atx-sjc-2026-09-live-ride-surface-go-or-django
  - todo-bloodride-atx-sjc-mint-roadtrip-creature-phonomeme-and-masthead-dress
  do_also: "PART B SHIPPED 2026-09-01 (CODI atx-sjc-terrain-cinders; roadtrip commit 13fc20a; Fly roadtrip-clodemode release v6, image deployment-01M1FP1HQ5JXCTFHVB435W7Y8H): body[data-leg] palettes for the four legs in static/css/app.css (sky, horizon, ink, muted, accent, masthead disc + five terrain tones; ink/bg 12.9–13.6, muted/bg 6.0–6.5, white-on-accent 4.6–6.3), templates/terrain.html = one flat-silhouette horizon SVG per leg (715–1355 B, shape only), full-bleed hero on / following defaultLeg (today's leg / leg 1 before departure / leg 4 after arrival), thin band on /legs/<slug>, /photos and sign-in wear leg 1, Odo's disc follows the leg. Live verified: / data-leg=hudson-bend-to-cloudcroft + #terrain-hudson-bend-to-cloudcroft; /legs/flagstaff-to-mammoth-lakes its own; creature.svg sha 7cae8adc… unchanged. Status stays building until Part A (clodemode.com Odo page, the other CODI) reports; whoever lands second sets shipped."
