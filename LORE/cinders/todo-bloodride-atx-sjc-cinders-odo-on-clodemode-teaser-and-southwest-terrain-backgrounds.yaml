entries:
- slug: todo-bloodride-atx-sjc-cinders-odo-on-clodemode-teaser-and-southwest-terrain-backgrounds
  title: 'CINDERS: curate Odo''s visuals — bake Odo onto clodemode.com (teaser character page + gallery + og) and give the roadtrip app per-leg southwest terrain backgrounds'
  domain: lore
  lore_type: todo
