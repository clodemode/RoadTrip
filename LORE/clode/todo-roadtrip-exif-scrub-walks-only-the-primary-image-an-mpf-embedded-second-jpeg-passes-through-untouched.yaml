entries:
- slug: todo-roadtrip-exif-scrub-walks-only-the-primary-image-an-mpf-embedded-second-jpeg-passes-through-untouched
  title: 'roadtrip: scrubJPEG stops at the first SOS, so a second JPEG embedded after the primary scan
    (Apple''s MPF HDR gain map, present in every iPhone original) passes through with its own APP segments
    untouched — today it carries only HDR XMP and no Exif, but the guarantee is by luck, not by construction'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: tools
  character_slug: clode
  tags:
  - roadtrip
  - exif
  - gps
  - privacy
  - mpf
  - gain-map
  - hardening
  status: design
  description: 'Found 2026-09-08 16:17Z verifying v26 (PR #7, exif_strip.go) against three served originals.
    Each iPhone JPEG holds TWO images: the primary (whose Exif APP1 the scrub rebuilds to 84 bytes — verified
    GPS none, MakerNote gone) and, after the primary''s scan, a second SOI…EOI — Apple''s HDR gain map,
    indexed by the APP2 MPF segment. The scrub''s segment walker copies everything from the first SOS
    to the end byte-for-byte, so the embedded image''s header — APP0 JFIF, APP1 XMP (596 bytes: HDRGainMap:HDRGainMapVersion/Headroom,
    apdi:AuxiliaryImageType), APP2 ×2, APP10 AROT — is untouched. Walked all three: no Exif APP1 in the
    embedded image, no GPS/latitude/longitude text in its XMP; the only "GPS"-looking byte runs in the
    files are entropy noise inside scan data. So nothing leaks TODAY, for Apple''s current gain-map layout.
    A different phone, a future iOS, or a photo that went through an editor could embed an image that
    DOES carry Exif GPS, and the scrub would publish it.'
  dont: Don't drop the embedded image to fix this — the gain map is what makes the HDR photo render right
    on iPhone/Safari, and the MPF offsets in APP2 point at it. Don't re-encode. Don't touch the DB row.
  do_this: 'In scrubJPEG, after copying the primary scan to its EOI, keep scanning: for every further
    SOI found, run the same segment filter on that image''s header (rebuild or drop its Exif APP1; drop
    any APP1 XMP that carries exif:GPS* or a GPS namespace; pass everything else) before copying its scan.
    Then fix up the MPF APP2 index in the primary if the embedded image''s byte length changed (MPF entries
    carry absolute offsets and sizes — recompute, or, simpler, rewrite the embedded header to the same
    byte length by padding the rebuilt APP1 with a COM segment so no offset moves). Add a test fixture
    with an embedded second JPEG carrying a GPS IFD; assert the output has no GPS IFD anywhere and the
    MPF offsets still resolve. Bump the sweep key to media_gps_stripped_v2 so the 21 stored originals
    are re-swept once.'
  do_also: 'Backup of the 21 pre-strip originals: ~/roadtrip_media_backup_2026-09-08/ on Kris''s Mac (0700,
    sha-verified) — the only copy anywhere with GPS; delete it once nobody needs a re-pin from EXIF (the
    DB rows keep lat/lng anyway).'
