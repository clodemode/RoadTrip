entries:
- slug: todo-roadtrip-chester-an-answer-that-follows-its-cards-arrives-in-one-piece-so-first-word-equals-total-find-out-why-and-whether-words-can-come-sooner
  title: 'roadtrip Chester: an answer that follows its place cards arrives in one piece, so time to first
    word equals the total; find out why, and whether the words can reach the page sooner'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: logic
  character_slug: clode
  tags:
  - chester
  - streaming
  - latency
  - claude-api
  status: design
  description: |-
    Observed 2026-11-06 on a local instance, quick mode, the default model, prompt version chester-rt-3. Written as if public: no place, travel date or person.

    Chester now asks for its place cards first and the answer after them. That order was forced: the default model returns text written ahead of a tool call as a thinking block, and under the default display that block arrives empty, so an answer written before its cards never reached the page (the first live question showed a card and no words).

    What three live questions showed. Two named places and so took two requests each (the cards, then the answer after the tool result). In both, the first word of the answer reached the server within 5 ms of the end of the whole question (about 19 s and 15 s): the second request's text arrived in one piece, not word by word. The third named no place and made no tool call, and it streamed normally: 40 pieces over 2 s, first word at 4.6 s of 6.5 s. So streaming works on the local path, and the progressive answer is lost exactly when there are cards, which is most quick questions.

    Not known: whether the API holds text that follows a tool result until the turn ends (it may need to know whether the text is a note before another tool call), or whether something in the second request causes it (the replayed thinking blocks, the fallback opt-in, the tool result itself). Also seen: the second request re-read about 2,100 to 2,700 input tokens uncached (the search results sent back), about a cent a question.
  dont: 'DONT go back to answer-then-cards on the default model: the answer comes back as an empty thinking
    block and the page gets a card and no words. DONT read first_ms on an answer with cards as time to
    first word on the page until this is understood: today it is the time the whole answer landed. DONT
    measure this against the stub alone: the stub streams whatever it is scripted to.'
  do_this: 'Stamp per-event arrival times on the second request, live, with the operator''s key (one or
    two quick questions). Then try, in this order, and keep the first that puts words on the page early:
    (1) thinking display ''updates'', so the wait shows progress notes; (2) carrying the answer in the
    show_places input, since a tool input streams as it is written and is never summarised, so one request
    serves cards and words; (3) a cache breakpoint on the follow-up so the search results are read from
    the cache. Any change to the prompt or the tool bumps the prompt version.'
  do_also: Record the finding on the Chester spec row. The check of the stream through the host's proxy,
    in the first-live-question todo, is separate and still open, as is comparing a day's logged dollars
    with the account's own usage report.
