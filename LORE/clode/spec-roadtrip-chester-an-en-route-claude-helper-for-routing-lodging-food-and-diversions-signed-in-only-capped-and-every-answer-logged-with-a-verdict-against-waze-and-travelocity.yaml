- slug: spec-roadtrip-chester-an-en-route-claude-helper-for-routing-lodging-food-and-diversions-signed-in-only-capped-and-every-answer-logged-with-a-verdict-against-waze-and-travelocity
  title: 'roadtrip CHESTER (Claude Helper Enabled System Task Execution Runtime): the trip-keeper asks
    the site for routing, lodging, food, sights and diversions while en route; the Go binary calls the
    Claude API directly; small queries are a live driving aid; every answer is logged with a verdict so
    its reliability is measured against Waze and Travelocity'
  domain: lore
  lore_type: spec
  app_scope: roadtrip
  lair: all
  character_slug: clode
  tags:
  - chester
  - claude-api
  - driving-assistant
  - evaluation-log
  - web-search
  - spend-cap
  - 2026-11
  status: shipped
  description: |-
    Kris, 2026-11-06. Written as if public: no place, travel date or person.

    PURPOSE. Two things at once: a helper on the road, and an instrument that discovers how capable and how reliable Claude-API travel aid is beside the dedicated tools. Chester follows the platform suggester pattern: the model guesses, the operator rules, and only a ruled answer is ever absorbed.

    A. ACCESS AND SPEND. Signed-in trip-keeper only (session or PUSH_TOKEN); never anonymous, because every call spends money. With no ANTHROPIC_API_KEY the feature is absent and boot logs chester: disabled; the key is a Fly secret set by Kris, never logged, never in the repo. A daily dollar cap (CHESTER_DAILY_USD) is computed from each response's own usage; past it Chester refuses in plain words. One query at a time.

    B. WHAT CHESTER IS TOLD. The active ride's selected plan (legs, miles, hours, checkpoint names and zones, arrival stamps), today's leg, miles left on it, the local time in the nearest checkpoint's zone, and a position: the browser's, when the trip-keeper taps to send it, else the last pinned post. Never the private overlay, never an unfuzzed coordinate of a private place, never a photo unless one is attached. The stable part of the prompt is cached.

    C. WHAT CHESTER CAN DO. Web search (server tool) for lodging, food, hours, weather and closures. It has no live traffic and says so on the page: turn-by-turn and traffic stay with a navigation app. Every place it names renders as a card with one-tap links out to a navigation app, a map and, for lodging, a booking search, so a comparison costs one tap.

    D. TWO MODES. Quick: preset buttons (fuel, food, rest stop, coffee, tonight's lodging, worth a stop, weather and roads ahead, how far to tonight) plus free text; a short streamed answer in large type, optional read-aloud through the browser, for the passenger or when parked. Plan: the evening question about tomorrow's route choice, lodging and diversions, longer and with more searching. Model and effort are settings per mode, not constants.

    E. THE LOG IS THE EXPERIMENT. Every query is a row: when and where (zone kept), mode, question, model, effort, time to first word and total, tokens, searches, dollars, answer, places, stop reason or error. The trip-keeper stamps a verdict in place: right, partly, wrong or unverified; what it was checked against (navigation app, booking site, map, on the ground); a note; and an optional number pair (Chester's figure and the reference, in minutes, dollars or miles). A signed-in log page lists rows, takes verdicts with one tap and summarises by mode and verdict with latency, cost and mean error; a signed-in JSON export carries the whole log. The log lives on the volume and never reaches an open endpoint.

    F. ON A HOTSPOT. Timeouts per mode, the question kept in the box on failure, one plain error line, a refusal stop reason handled, no boot-time work.

    Shipped: 2026-11-06, thread-rt-kingston-to-hudson-bend-trip-2026-11-06: Merged as clodemode/RoadTrip PR 2 (merge 16df6f3, 2026-11-06 22:20 UTC), deployed 22:29 UTC; 173 tests, a cold review and two fix rounds; six live quick questions on the operator's key (five local, one on the live site through Fly: first words at 2.9 s, done at 4.8 s, $0.044).
  dont: 'DONT expose Chester to an anonymous visitor. DONT log or commit the API key. DONT send the private
    overlay or an unfuzzed private coordinate to the API. DONT present a drive time as live traffic. DONT
    absorb an unruled answer into the plan. DONT hardcode the model: it is a per-mode setting. DONT open
    a modal: verdicts and answers open in place.'
  do_this: Build on the official Go SDK after the trip-file wave lands, with the API stubbed in tests
    (no network, no spend), a fixture ride, and one RED control. A live call is made only by Kris's key
    on a deployed or local instance, and its cost is reported.
  do_also: 'Later rows: an accepted suggestion becomes a stop on the leg (needs an origin column the seed
    refresh leaves alone); voice input; a summary of the log after the trip that answers the comparison.'
