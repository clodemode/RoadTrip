  title: 'roadtrip + musicorgan: DriveTrack, RoadTrip plays SoundTrack from the music.opeongo.net player
    over a shared service key, and Chester helps pick driving music live and plans it per leg'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: logic
  character_slug: clode
  tags:
  - driver
  - chester
  - musicorgan
  - drivetrack
  - kris-idea-2026-11-07
  status: design
  description: 'Kris 2026-11-07. RoadTrip and MusicOrgan are both CLODE apps; share one service key (Fly
    secret on both) so RoadTrip can search MusicOrgan (albums, playlists) and open or embed the music.opeongo.net
    player. Chester gets a tool to suggest DriveTrack picks for the current leg (live) and a planned per-leg
    soundtrack. Unknown before building: whether MusicOrgan exposes a search/playlist API usable by a
    bearer key today (verify first). First cut: a token-guarded read-only MO endpoint + RoadTrip "DriveTrack"
    card on /driver linking into the player; Chester suggestions second. Estimate: two CODIs across two
    repos, about 300k-450k subagent tokens; less if MO already has the API.'
  dont: DONT give RoadTrip a MusicOrgan user login; a scoped read-only service key only. DONT stream audio
    through RoadTrip.
  do_this: Verify MusicOrgan's existing API and auth first; then one read-only search endpoint behind
    a shared bearer key; RoadTrip links into the player.
  effort: L
  impact: high
