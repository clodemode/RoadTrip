  description: 'Kris 2026-11-07: "Drivers are assigned to Rides, like our current Austin2HudsonBend trip."
    Users store gains a ride assignment list; admins assign on /driver/users; driver-only pages and writes
    scope to assigned rides; admins see all. Chester pick notes and TomTom knowledge stay shared; Chester
    conversation, leanings and log stay private per driver (PR 9). Estimate: one CODI, about 120k-180k
    subagent tokens. IMPLEMENTED in draft PR 10 (clodemode/RoadTrip, branch krispy/driver-only-checklist-geojson,
    commit e3731a7); not merged or deployed. Not done: Chester page/log gating by ride (PR 9 files).'
  dont: DONT let a driver write to a ride they are not assigned to. DONT make Chester memory per ride;
    it is per driver.
  do_this: Add assignment to the users store, gate driver writes by it, test a driver on ride A refused
    on ride B.
