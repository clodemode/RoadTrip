  title: 'roadtrip: drivers are assigned to rides (e.g. the current Kingston-to-Hudson-Bend trip); an
    admin assigns them on /driver/users, and a signed-in driver sees and acts on (checklist, plan, posts,
    picks shared per ride) only the rides they are assigned to'
