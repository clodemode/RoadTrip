  description: 'WHERE THINGS ARE (2026-09-07 18:30Z). Spec: spec-roadtrip-made-it-to-route-lock-push-token-and-lodging-actuals-cloud-run-2026-09-07 (read it first). PUSH_TOKEN is minted and set: Fly secret on roadtrip-clodemode (machine updated 18:17Z) and GitHub Actions secret on clodemode/roadtrip; the value lives only in Kris''s ~/.roadtrip_push_token (0600). The Phase C overlay document (checkpoints 3–6 with the private street text) is ready in Kris''s ~/.roadtrip_private.json (0600) — never copy it into LORE or a repo. A Claude Code cloud routine (trig_01CQTbQwLZXbqiE1cLePFDfL, run cse_018ef4x9smqxAoEEfHTVqcjt, Opus 5, env CLODE_MODE) started 18:22Z in clodemode/roadtrip doing PHASE A ONLY on a claude/… branch and is instructed to open a PR against trunk and never deploy; at 18:29Z it was still reading code, no branch pushed. Kris was considering starting his own cloud session instead — if two ran, there may be two PRs; keep one, close the other. The stale branch claude/post-metadata-editing-x25ksv was deleted from origin 18:24Z (squash-merged, zero diff). Local CLODE/roadtrip is at trunk 6947f08, clean.'
  dont: Don't dispatch Deploy from a cloud session — Kris (or this thread from the Mac) dispatches `gh workflow run Deploy -R clodemode/roadtrip --ref trunk -f mode=apply` after the PR merges. Don't paste the token or any overlay address into a PR, a log, LORE or chat. Don't delete near-duplicate posts (same taken_at, different sha) without Kris; only identical uploads (same photo id/sha) are culled, keeping the earliest. Don't push the overlay before the token code is deployed — /driver/private only honours the bearer once Phase A ships; before that the only writer is the cookie session.
  do_this: '(1) `gh pr list -R clodemode/roadtrip` — find the Phase A PR (or the branch; open the PR yourself if the session pushed but did not). Review against the spec''s A1–A4; CI must be green. Kris merges. (2) Deploy apply, then prove: anonymous `curl -sI https://roadtrip.opeongo.net/` still 302; `curl -H "Authorization: Bearer $(cat ~/.roadtrip_push_token)" …/driver/posts.json` returns JSON; flyctl logs show `push token: set`. (3) Phase C from the Mac: push ~/.roadtrip_private.json to /driver/private (response checkpoints=4); census posts.json → duplicates; delete identical uploads; list near-dupes for Kris; arrive checkpoints 3/4/5/6 from each night''s lodging post id (route.geojson checkpoint features now carry id); leg 4''s pass from the 2026-09-07 pins — if Sonora (CA-108) rewrite the seed hint + vertices in a follow-up commit. (4) Proof: route.geojson track count and the checkpoint {id, order, name, arrived_at, precision} list. (5) Close: this row and the lodging half of todo-roadtrip-seed-data-items-before-departure-lodging-pins-geocode-tioga; update the spec to shipped; delete the cloud branch after merge.'
  do_also: 'PROGRESS 2026-09-08 14:27Z (thread "RoadTrip: fix push token + run Phase C"): Phase A merged + deployed. Phase C from the Mac by bearer: overlay pushed (checkpoints=4); cp3 Cloudcroft arrived from post 8 at 2026-09-05T01:06:10Z (fuzzed, snapped cell); cp4 Ash Fork arrived from post 14 at 2026-09-06T02:02:22Z (exact, the motel); cp5 Bridgeport left — its 2026-09-07T03:06:47Z stamp is a real tap and there is no lodging post; duplicate post 19 deleted on Kris''s say-so (census 22 posts). LEG 4 RULED by Kris 2026-09-08: driven over CA-108 SONORA PASS, not Tioga — seed rewritten (roadtrip 978c0e3: hint, 9 vertices via Sonora Junction/Dardanelle/Strawberry/Sonora/Oakdale/Manteca, est_miles 250, Mono Lake sight → leg 3, Tuolumne candidate → Sonora Pass summit), CI green, Deploy apply → Fly v25, boot log "legs 4 refreshed, sights 15 replaced", live route.geojson leg 4 hint reads Sonora Pass. STILL OPEN: (a) cp6 Menlo Park not arrived — no post there, needs Kris''s arrival time: POST /driver/checkpoint/6/arrive with at=<RFC3339>, no location (stays the fuzzed seed cell); the leg-4 track appears only after this. (b) tags worth a look at /driver/post/<id>/edit: posts 9, 11, 12 dated 09-04 tagged leg 2; post 23 dated 09-05 tagged leg 3; post 5 (VLA, NM) tagged checkpoint 4 Ash Fork. Also disable routine trig_01CQTbQwLZXbqiE1cLePFDfL if it is still enabled (it was a run_once; it auto-disables after firing). After the trip: todo-bloodride-retire-the-ride-rsync-to-memewears-now-that-roadtrip-opeongo-net-is-live and todo-roadtrip-post-trip-migrate-fredberg-and-blance-seeds-decide-django-bloodride-drive-lens-only.'
