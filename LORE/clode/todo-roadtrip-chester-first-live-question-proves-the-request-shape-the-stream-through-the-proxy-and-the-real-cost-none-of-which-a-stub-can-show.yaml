- slug: todo-roadtrip-chester-first-live-question-proves-the-request-shape-the-stream-through-the-proxy-and-the-real-cost-none-of-which-a-stub-can-show
  title: 'roadtrip Chester: the first live question, asked with the operator''s own key, has to prove
    three things no stub can: the API accepts the request as built, the answer streams through the host''s
    proxy word by word, and the logged dollars match the bill'
  domain: lore
  lore_type: todo
  app_scope: roadtrip
  lair: tools
  character_slug: clode
  tags:
  - chester
  - claude-api
  - live-verification
  - streaming
  - spend-cap
  - 2026-11
  status: shipped
  description: |-
    Chester was built and tested against a local stand-in for the Messages API. Every test stubs the API at the SDK's HTTP boundary, so nothing about the real service has been observed. Three things are unproven and each can fail silently or loudly on the first real question.

    1. THE REQUEST SHAPE. One request carries, together: adaptive thinking with an effort level, the web search server tool (the current version, with max_uses and a user_location of zone and town), one strict client tool whose input is streamed eagerly, a cache breakpoint on the ride plan, and the server-side fallback opt-in under its beta header. Each is written from the SDK's own types and the published guidance, but the combination has never met the API. A 400 names what it disliked; Chester shows that sentence on the page and stores it in the log row, so the first failure is readable. CHESTER_FALLBACK=off removes the fallback opt-in without a deploy of code.

    2. THE STREAM. The answer is sent to the browser as one JSON object a line and flushed after each. Whether the host's proxy passes those lines as they are written, or holds them and delivers the answer in one piece, is unknown. If it buffers, time to first word on the page equals total time and the large-type streaming is lost, though the answer is still right.

    3. THE COST. Dollars are computed from the response's own token counts at list prices plus a per-search fee. Compare one day's logged total against the account's own usage report. Also read cache_read on the second question inside five minutes: zero means the cached prefix (tools, prompt, plan) is under the model's minimum or is not stable.

    Also unmeasured until then: latency per mode, how often the model calls the place-card tool last as instructed (a call before any text costs a second request), and search quality.
  dont: 'DONT ask the first live question from a test, a CODI or CI: it spends the operator''s money and
    is asked by the operator on a running instance. DONT read a green suite as evidence about the real
    API: the suite proves the code against a stand-in.'
  do_this: 'With the key set as a secret on a running instance: ask one quick preset and one plan question,
    read both rows in /driver/chester/log (stop reason, error, first word against total, tokens, cache
    read on the second, searches, dollars), watch whether the words arrive progressively in the browser,
    and compare the day''s logged dollars with the account''s usage report. Record what was found on the
    spec row.'
  do_also: If the request is refused, the log row's error names the field; fix that one field and bump
    the prompt version only if the prompt, context or tool changed.
