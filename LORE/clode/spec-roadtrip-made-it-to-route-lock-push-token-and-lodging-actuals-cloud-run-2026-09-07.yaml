entries:
- slug: spec-roadtrip-made-it-to-route-lock-push-token-and-lodging-actuals-cloud-run-2026-09-07
  title: 'roadtrip cloud run 2026-09-07: a fixed 24-hex PUSH_TOKEN bearer beside the cookie, an arrival that locks the checkpoint to the photo pin and bends the leg lines (Plan-to-Be → Made-it-To), night 3 = Bridgeport, lodging actuals into the overlay, duplicate posts culled through the API'
  domain: lore
  lore_type: spec
  app_scope: roadtrip
  lair: all
  character_slug: clode
  tags:
  - atx-sjc
  - roadtrip
  - cloud-run
  - push-token
  - data-carriage
  - caddis
  - made-it-to
  status: shipped
  description: 'PLANNED 2026-09-07 by thread "Roadtrip app cloud run planning" for a Claude Code on the web run in clodemode/roadtrip (the 2026-09-06 web run on branch claude/post-metadata-editing-x25ksv shipped post edit, the Ash Fork leg and the /driver/private data carriage — releases v17/v18). VERIFIED STATE at trunk 6947f08 = v18: (a) post delete already exists (POST /driver/post/{id}/delete, button on / and /legs, signed-in only; photo bytes stay). (b) planning is seed-owned until actualized, but "arrived" stamps a TIME only — checkpoint lat/lng never move and leg polylines never follow anything; there is no Made-it-To. (c) lodging is NOT updated: private.json on the volume carries only checkpoint 3 as "the host home, Cloudcroft, NM" (no Loop, no host note); seed checkpoint 5 is still "Mammoth Lakes, CA (near) / Night 3 — lodging TBC" and legs 3/4 still name Mammoth; the Data workflow (Kris: "Data Carriage (CADDIS)") has NEVER run — repo secrets are FLY_API_TOKEN only, no PRIVATE_JSON, no ADMIN_PASSWORD. There is NO token/API path: /driver/private is a JSON POST behind the same cookie session, which is why the carriage signs in with the password. The Fly image is scratch (fly ssh: fork/exec /bin/bash: no such file), so the SQLite cannot be pulled off the volume — the only census of posts is through the app. ACTUALS Kris gave: night 1 = the host home, Cloudcroft NM (Charles was host; private place, stays fuzzed); night 2 = Canyon''s Edge Motel, Ash Fork AZ (photos already up); night 3 = The Bodie Hotel (Bunk Room), Bridgeport CA [-119.2312, 38.2555], NOT Mammoth Lakes. The full prompt handed to Kris is ROADTRIP_CLOUD_RUN_2026-09-07.md (scratchpad of this thread; also pasted in the chat).'
  dont: Don't build a second credential or Basic auth — the token is a bearer accepted by Auth.IsAuthed beside the cookie, so requireAuth AND the visibility gate both honour it with one change. Don't log the token or any address; counts only. Don't put street text, host names or lodging addresses in the seed or the repo — business names of public lodging and town pins are fine in the seed label. Don't guess leg 4's pass (Tioga vs Sonora) — let the 2026-09-07 post pins decide. Don't delete near-duplicate posts (same taken_at, different sha) automatically — list them for Kris; only identical uploads (same photo id/sha) are culled, keeping the earliest. Don't push to trunk or dispatch Deploy from the web agent — PR, Kris merges and dispatches. Don't let an arrival at a fuzzed checkpoint store the raw fix — it stays snapped.
  do_this: 'Phase A, one PR: (A1) PUSH_TOKEN env, 24 hex from `openssl rand -hex 12`, Fly secret; IsAuthed accepts `Authorization: Bearer` via subtle.ConstantTimeCompare, empty env disables; boot log push token: set/unset; data.yml switches from ADMIN_PASSWORD sign-in to the bearer from repo secret PUSH_TOKEN; README row + curl subsection; tests. (A2) GET /driver/posts.json — every post incl. unpinned, with photo id/sha256/taken_at, for the duplicate census. (A3) Made-it-To: arrive accepts post_id or lat+lng → arrived_at + lat/lng overwritten + precision=exact unless fuzzed; loadRide replaces a leg''s last vertex (and the next leg''s first) with an arrived terminal checkpoint''s published point; route.geojson gains kind=track per leg (arrived origin → pinned posts by occurred_at → arrived terminus), map.js dims planned legs that have a track; checkpoint features carry id. (A4) seed: checkpoint 5 → Bridgeport, CA / "Night 3 — The Bodie Hotel (Bunk Room)"; checkpoint 4 label "Night 2 — Canyon''s Edge Motel"; leg 3 Ash Fork → Bridgeport (~505 mi via US-6/US-395 N); leg 4 Bridgeport → San Jose, pass decided by the photos. Phase B, Kris: merge; fly secrets set PUSH_TOKEN; gh secret set PUSH_TOKEN; gh workflow run Deploy -f mode=apply; anonymous curl still 302 (site stays private). Phase C, curl with the token: push the whole overlay {3: the host home in Cloudcroft / Charles was host, 4: Canyon''s Edge Motel Ash Fork, 5: The Bodie Hotel (Bunk Room) Bridgeport}; census posts.json → cull identical uploads, list near-dupes; arrive checkpoints 3/4/5 with each night''s lodging post_id (6 when Kris is in); prove with jq over route.geojson (track count, checkpoints with arrived_at + precision).'
  do_also: 'Closes, when shipped: the lodging half of todo-roadtrip-seed-data-items-before-departure-lodging-pins-geocode-tioga and item (3) of todo-roadtrip-road-side-residuals-before-departure-2026-09-04; the leg-endpoint follow also answers todo-roadtrip-leg-polyline-vertex-defeats-the-cloudcroft-checkpoint-fuzz (a fuzzed terminus contributes its snapped point). Kris''s name for the Data workflow is CADDIS — the character offered for the fintrack carriage on 2026-08-31 and not ruled then; it now has a second user. TERMINUS SUPPLIED 2026-09-07 18:20Z: the trip ends at a private residence in MENLO PARK (street text in the overlay only, checkpoint 6) — seed checkpoint 6 becomes "Menlo Park, CA" / Terminus / precision fuzzed on the 0.05° grid, leg 4 Bridgeport → Menlo Park, ride terminus_label Menlo Park; the ride name "Austin → San Jose" stays as the trip''s identity unless Kris rules otherwise. TOKEN MINTED 2026-09-07 18:17Z by this thread: PUSH_TOKEN set as a Fly secret on roadtrip-clodemode (machine updated) and as a GitHub Actions secret on clodemode/roadtrip; the value is in Kris''s ~/.roadtrip_push_token (0600) and nowhere in LORE. The app ignores it until Phase A ships. After the trip the same token can carry the fredberg/blance seed migrations (todo-roadtrip-post-trip-migrate-fredberg-and-blance-seeds-decide-django-bloodride-drive-lens-only).'
