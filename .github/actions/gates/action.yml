name: gates
description: >-
  The checks a release has to pass, by TEST SCOPE: static (gofmt, node --check,
  go vet, go build), js, unit (under -race), features (the scenarios, in
  parallel shards, no -race) and rigs. ONE definition, scripts/ci/gate.sh, run
  here exactly as the pre-push hook and the local seal run it. Used by ci.yml
  (the record, once per merge to trunk) and by deploy.yml (only when nothing
  proves the commit). Expects the repo checked out and Go set up; node ships on
  the runner.

runs:
  using: composite
  steps:
    # Ruled by Kris 2026-11-12: the scenarios run WITHOUT the race detector
    # (under it they took 9 to 16 minutes); it stays on every plain test, where
    # the shared state is. Since 2026-11-16 the scenarios also run as one
    # process per shard, side by side, from one compiled test binary.
    - name: whole suite, by scope
      shell: bash
      run: bash scripts/ci/gate.sh --scopes whole --log-dir "$RUNNER_TEMP/gate"
