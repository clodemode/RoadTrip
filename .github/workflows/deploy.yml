# Deploy to Fly — BY HAND ONLY.
#
# workflow_dispatch and nothing else. There is deliberately no push trigger:
# roadtrip is live under someone's thumb from a car, and auto-releasing every
# commit to trunk would put an unreviewed build in front of the ride with no
# explicit go. The fleet rule (fintrack, operator ruling 2026-09-01) is that a
# deploy originates in CI and is dispatched by a person.
#
# ONE-TIME SETUP: a deploy token in the repo secret FLY_API_TOKEN —
#   fly tokens create deploy -a roadtrip-clodemode
# then Settings → Secrets and variables → Actions → New repository secret.
#
# THE SHAPE (2026-11-16): PROVE, MINT ONCE, SEAL, RELEASE THE SEALED DIGEST.
#
#   prove   The suite is not run here when something already proved THIS EXACT
#           COMMIT. In order: an earlier run of this workflow that sealed it
#           (its `seal` artifact, which also names the image); the commit
#           status `roadtrip/seal`, posted by scripts/ci/seal.sh --post after a
#           whole run on a local host; a successful ci.yml run on trunk.
#           Anything else (none found, a red one, a different commit, the
#           lookup itself failing) runs every gate here. The lean path is
#           taken on positive proof alone.
#   mint    The image is built ONCE per commit, on Fly's builder, pushed to the
#           registry as sha-<commit>, and from then on named by its DIGEST. A
#           run that found an earlier seal of the commit mints nothing.
#   seal    seal.json: the commit, the digest, and what proved the commit.
#           Uploaded as the run's `seal` artifact and printed in the summary.
#   release mode=apply releases THAT digest (flyctl deploy --image ...@sha256),
#           never a rebuild: the bytes that were minted are the bytes that
#           serve. Then two independent readings: Fly's own record of what the
#           machine runs, and the instance's /healthz naming its commit.
#
#   mode=plan   prove, mint, seal. Nothing is released. The default, so a slip
#               of the finger does not reach the ride.
#   mode=apply  the same, then the release. After a plan of the same commit it
#               inherits that plan's seal and goes straight to the release.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = prove, mint and seal (no release). apply = that, then release the sealed image."
        type: choice
        required: true
        default: plan
        options: [plan, apply]

permissions:
  contents: read
  # To ask whether CI or an earlier Deploy run proved this commit, and to read
  # that run's seal artifact.
  actions: read
  # To read the roadtrip/seal commit status.
  statuses: read

concurrency:
  # Never two releases at the same machine at once.
  group: deploy-roadtrip
  cancel-in-progress: false

env:
  FLY_APP: roadtrip-clodemode
  # /healthz is the one path exempt from both the canonical-host 301 and the
  # SITE_VISIBILITY=private gate, so it answers on the .fly.dev host while the
  # site itself is closed. That is what makes it usable as a probe.
  PROBE_URL: https://roadtrip-clodemode.fly.dev/healthz

jobs:
  deploy:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail closed: `proven` is true only on a positive answer about exactly
      # this commit. Every lookup that errors, comes back empty or surprises
      # leaves it false, and the gates run.
      - name: prove — look for a seal or a record of this commit
        id: prove
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          proven=false; proof=''; digest=''
          repo="$GITHUB_REPOSITORY"; sha="$GITHUB_SHA"

          # 1. An earlier run of this workflow that sealed this commit.
          if ids=$(gh run list -R "$repo" --workflow deploy.yml --commit "$sha" --status success \
                --limit 10 --json databaseId,headSha 2>/dev/null \
                | jq -r --arg sha "$sha" '.[] | select(.headSha == $sha) | .databaseId'); then
            for id in $ids; do
              rm -rf "$RUNNER_TEMP/seal-in"
              if gh run download "$id" -R "$repo" -n seal -D "$RUNNER_TEMP/seal-in" 2>/dev/null \
                 && [ -f "$RUNNER_TEMP/seal-in/seal.json" ]; then
                c=$(jq -r '.commit // ""' "$RUNNER_TEMP/seal-in/seal.json")
                d=$(jq -r '.digest // ""' "$RUNNER_TEMP/seal-in/seal.json")
                if [ "$c" = "$sha" ] && printf '%s' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                  proven=true; digest="$d"; proof="Deploy run $id sealed this commit as $d"
                  break
                fi
              fi
            done
          fi

          # 2. A whole run on a local host, posted on the commit by seal.sh --post.
          if [ "$proven" != true ]; then
            if state=$(gh api "repos/$repo/commits/$sha/statuses" \
                  --jq '[.[] | select(.context == "roadtrip/seal")][0].state // ""' 2>/dev/null); then
              if [ "$state" = success ]; then proven=true; proof="commit status roadtrip/seal is success (a local whole run)"; fi
            fi
          fi

          # 3. The CI record: a successful ci.yml run on trunk for this commit.
          if [ "$proven" != true ]; then
            if hit=$(gh run list -R "$repo" --workflow ci.yml --branch trunk --commit "$sha" --status success \
                  --limit 5 --json databaseId,conclusion,headSha 2>/dev/null \
                  | jq -r --arg sha "$sha" '[.[] | select(.headSha == $sha and .conclusion == "success")][0].databaseId // ""'); then
              if [ -n "$hit" ]; then proven=true; proof="CI run $hit on trunk is green for this commit"; fi
            fi
          fi

          if [ "$proven" = true ]; then
            echo "::notice title=proven::gates skipped for $sha: $proof"
          else
            proof="every gate ran in this Deploy run"
            echo "::notice title=gates::nothing proves $sha yet; running every gate here"
          fi
          { echo "proven=$proven"; echo "proof=$proof"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.prove.outputs.proven != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/gates
        if: steps.prove.outputs.proven != 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only: the image is built on Fly's builder, so it does not
      # depend on this runner's docker state. --push with a label named for the
      # commit puts it in the registry without releasing it. The digest is read
      # twice: from the builder's own account of the push, and back from the
      # registry. No digest, or two that differ, and the run stops: nothing can
      # be sealed that cannot be named.
      - name: mint — build the image once and name it by digest
        id: mint
        if: steps.prove.outputs.digest == ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          ref="registry.fly.io/$FLY_APP:sha-$GITHUB_SHA"
          flyctl deploy --build-only --push --remote-only -a "$FLY_APP" \
            --image-label "sha-$GITHUB_SHA" --build-arg "GIT_SHA=$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/mint.log"
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error title=mint::the build or the push failed; nothing was minted"; exit 1; }
          built=$(grep -oE "pushing manifest for ${ref}@sha256:[0-9a-f]{64}" "$RUNNER_TEMP/mint.log" | tail -n 1 | grep -oE 'sha256:[0-9a-f]{64}' || true)
          flyctl auth docker >/dev/null
          held=''
          # The registry can lag the push by a few seconds; this is the one wait
          # here, bounded, and it ends on the registry's own answer.
          for pause in 0 2 4 8 16; do
            sleep "$pause"
            held=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // ""' || true)
            [ -n "$held" ] && break
          done
          echo "builder printed: ${built:-nothing}; registry holds: ${held:-nothing}"
          if ! printf '%s' "$held" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error title=mint::the registry does not show $ref, so the image cannot be named. No digest, no release."; exit 1
          fi
          if [ -n "$built" ] && [ "$built" != "$held" ]; then
            echo "::error title=mint::the builder pushed $built and the registry holds $held for $ref. No release."; exit 1
          fi
          echo "digest=$held" >> "$GITHUB_OUTPUT"

      - name: seal — the commit, the digest and what proved it
        id: seal
        env:
          INHERITED: ${{ steps.prove.outputs.digest }}
          MINTED: ${{ steps.mint.outputs.digest }}
          PROOF: ${{ steps.prove.outputs.proof }}
          MODE: ${{ inputs.mode }}
        run: |
          digest="$INHERITED"; minted=inherited
          if [ -z "$digest" ]; then digest="$MINTED"; minted=this-run; fi
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error title=seal::no digest to seal"; exit 1; }
          image="registry.fly.io/$FLY_APP@$digest"
          jq -n --arg commit "$GITHUB_SHA" --arg digest "$digest" --arg image "$image" \
                --arg proof "$PROOF" --arg minted "$minted" \
                --arg run "$GITHUB_RUN_ID" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{commit: $commit, digest: $digest, image: $image, proof: $proof, minted: $minted, run: $run, sealed_at: $at}' \
            > seal.json
          cat seal.json
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Seal"
            echo "- commit \`$GITHUB_SHA\`"
            echo "- image \`$image\` ($minted)"
            echo "- proof: $PROOF"
            echo "- mode: $MODE"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=sealed::$GITHUB_SHA → $image ($MODE)"

      - uses: actions/upload-artifact@v4
        with:
          name: seal
          path: seal.json
          if-no-files-found: error

      # The release names the image by digest: nothing is built here.
      - name: apply — release the sealed image
        if: inputs.mode == 'apply'
        run: flyctl deploy --image "$IMAGE" -a "$FLY_APP" --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: ${{ steps.seal.outputs.image }}

      # A deploy's own exit code is not a state report. First reading: Fly's
      # record of the image every machine of the app now runs.
      - name: apply — the machines run the sealed digest
        if: inputs.mode == 'apply'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          WANT: ${{ steps.seal.outputs.digest }}
        run: |
          want="$WANT"
          got=$(flyctl machine list -a "$FLY_APP" --json | jq -r '[.[].image_ref.digest] | unique | join(" ")')
          echo "machines run: ${got:-nothing}; sealed: $want"
          if [ "$got" != "$want" ]; then
            echo "::error title=digest::the machines run '${got:-nothing}', not the sealed $want"; exit 1
          fi
          echo "::notice title=digest::every machine runs the sealed $want"

      # Second reading, independent of Fly's API: ask the instance itself which
      # commit it was built from. The machine may be suspended, so curl retries
      # while it resumes; the answer must name THIS commit, so the release
      # before this one answering 200 does not pass.
      - name: apply — probe that this commit serves
        if: inputs.mode == 'apply'
        run: |
          body=$(curl -sS --fail --max-time 20 --retry 8 --retry-delay 3 --retry-all-errors "$PROBE_URL") || {
            echo "::error title=probe::$PROBE_URL did not answer 200; the release may be bad"; exit 1; }
          serving=$(printf '%s' "$body" | jq -r '.commit // ""')
          echo "$PROBE_URL → $body"
          if [ "$serving" != "$GITHUB_SHA" ]; then
            echo "::error title=probe::the instance serves commit '${serving:-none named}', not $GITHUB_SHA"; exit 1
          fi
          echo "::notice title=probe::$PROBE_URL serves $GITHUB_SHA"

      - name: status
        if: always()
        run: flyctl status -a "$FLY_APP" || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
