# Deploy to Fly — BY HAND ONLY.
#
# workflow_dispatch and nothing else. There is deliberately no push trigger:
# roadtrip is live under someone's thumb from a car, and auto-releasing every
# commit to trunk would put an unreviewed build in front of the ride with no
# explicit go. The fleet rule (fintrack, operator ruling 2026-09-01) is that a
# deploy originates in CI and is dispatched by a person.
#
# ONE-TIME SETUP: a deploy token in the repo secret FLY_API_TOKEN —
#   fly tokens create deploy -a roadtrip-clodemode
# then Settings → Secrets and variables → Actions → New repository secret.
#
# LEAN: the gates (.github/actions/gates) are skipped ONLY when CI proved this
# exact commit: a completed, successful run of ci.yml on trunk for github.sha.
# Anything else (CI still running, red, cancelled, a different commit, or the
# lookup itself failing) runs every gate here, exactly as before. The lean path
# is taken on positive proof alone. So merge, wait for CI on trunk to go green,
# then dispatch.
#
#   mode=plan   the gates (or the CI record), and the image built on Fly's
#               remote builder, WITHOUT releasing it. The default, so a slip of
#               the finger does not reach the ride.
#   mode=apply  the gates (or the CI record), then the release, then an
#               INDEPENDENT probe that the instance actually serves — a
#               deploy's own verdict is not a state report.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = build only (no release). apply = build and release."
        type: choice
        required: true
        default: plan
        options: [plan, apply]

permissions:
  contents: read
  # Only to ask whether CI has a green run for this commit.
  actions: read

concurrency:
  # Never two releases at the same machine at once.
  group: deploy-roadtrip
  cancel-in-progress: false

env:
  FLY_APP: roadtrip-clodemode
  # /healthz is the one path exempt from both the canonical-host 301 and the
  # SITE_VISIBILITY=private gate, so it answers on the .fly.dev host while the
  # site itself is closed. That is what makes it usable as a probe.
  PROBE_URL: https://roadtrip-clodemode.fly.dev/healthz

jobs:
  deploy:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail closed: `proven` is true only when gh returned a successful ci.yml
      # run on trunk whose head is exactly this commit. An in-progress run is
      # not status=success, so it counts as no record. Any error, empty answer
      # or surprise leaves proven=false and the gates run.
      - name: look for a CI record of this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          proven=false
          if runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch trunk \
                --commit "$GITHUB_SHA" --status success --limit 5 \
                --json databaseId,url,conclusion,headSha); then
            hit=$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" \
              '[.[] | select(.headSha == $sha and .conclusion == "success")][0] | select(. != null) | "\(.databaseId) \(.url)"') || hit=""
            if [ -n "$hit" ]; then
              proven=true
              echo "::notice title=lean::gates skipped; trusting CI run ${hit%% *} for $GITHUB_SHA: ${hit#* }"
            fi
          fi
          if [ "$proven" != true ]; then
            echo "::notice title=gates::no successful CI run on trunk for $GITHUB_SHA; running every gate here"
          fi
          echo "proven=$proven" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.ci.outputs.proven != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/gates
        if: steps.ci.outputs.proven != 'true'

      - name: name the commit being shipped
        run: |
          echo "::notice title=shipping::${{ github.sha }} (${{ github.ref_name }}) → $FLY_APP, mode=${{ inputs.mode }}"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only: the image is built on Fly's builder, so it does not
      # depend on this runner's local docker state and is reproducible off any
      # one machine.
      - name: plan — build without releasing
        if: inputs.mode == 'plan'
        run: flyctl deploy --build-only --remote-only -a "$FLY_APP"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: apply — build and release
        if: inputs.mode == 'apply'
        run: flyctl deploy --remote-only -a "$FLY_APP" --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # An independent probe: ask the instance itself, rather than trusting the
      # deploy's own exit code. The machine may be suspended, so allow for the
      # resume before calling it a failure.
      - name: apply — probe that it serves
        if: inputs.mode == 'apply'
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/probe.txt -w '%{http_code}' --max-time 20 "$PROBE_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "::notice title=probe::$PROBE_URL → 200 $(cat /tmp/probe.txt)"
              exit 0
            fi
            echo "attempt $i: HTTP $code — retrying"
            sleep 6
          done
          echo "::error title=probe::$PROBE_URL never returned 200; the release may be bad"
          cat /tmp/probe.txt || true
          exit 1

      - name: status
        if: always()
        run: flyctl status -a "$FLY_APP" || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
