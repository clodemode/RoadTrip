# CI — once per merge to trunk, as the record.
#
# This runs every check a release needs (.github/actions/gates) and builds the
# production image. It is also the PROOF deploy.yml trusts: when a successful
# run of this workflow exists for the exact commit being deployed, deploy.yml
# does not run the suite a second time. So a red trunk is known BEFORE anyone
# reaches for the deploy workflow. It never touches Fly and never needs a
# secret: nothing here can reach the live ride.
name: CI

# Ruled 2026-11-05: the suite runs on local hosts before a push; GitHub runs it
# once per merge as the record. Ruled 2026-11-12: a deploy trusts that record
# instead of running the suite again. No other trigger belongs here.
on:
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  # A newer merge supersedes an in-flight run, so stacked merges do not queue.
  group: ci-trunk
  cancel-in-progress: true

jobs:
  go:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The go directive in go.mod is the single source of truth for the
          # toolchain, so CI cannot drift from what the Dockerfile builds with.
          go-version-file: go.mod
          cache: true

      # gofmt, js syntax, js tests, vet, build, test: one definition, shared
      # with deploy.yml's fallback gates.
      - uses: ./.github/actions/gates

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Prod ships the IMAGE, so an image that does not build is a broken
      # deploy no matter how green the Go job is. Built here, never pushed —
      # publishing an image is the deploy workflow's job alone.
      - name: build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
